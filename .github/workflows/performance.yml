name: Representative-scale packaged performance

on:
  push:
    branches: [codex/issue-41-performance]
  workflow_dispatch:

concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  performance:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.21.1
          cache: npm
      - run: npm ci
        id: candidate-dependencies
      - uses: actions/checkout@v4
        with:
          ref: d925f8b758caea6dc079061d42be1d132dcbc8a1
          path: baseline-source
      - run: npm ci
        working-directory: baseline-source
      - name: Package immutable baseline
        shell: bash
        working-directory: baseline-source
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then npm run package:dev:mac; else npm run package:dev:win; fi
      - name: Measure baseline with the same harness and targets
        shell: bash
        run: |
          set -o pipefail
          mkdir -p work/ci-performance/baseline
          export WORKSPACE_PERFORMANCE_ROOT="$GITHUB_WORKSPACE/baseline-source"
          node scripts/smoke-performance.mjs 2>&1 | tee work/ci-performance/baseline/runtime.log
        env:
          WORKSPACE_SMOKE_EVIDENCE_DIR: work/ci-performance/baseline
      - name: Package candidate
        id: candidate-package
        if: ${{ !cancelled() && steps.candidate-dependencies.outcome == 'success' }}
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then npm run package:dev:mac; else npm run package:dev:win; fi
      - name: Require candidate correctness and approved targets
        if: ${{ !cancelled() && steps.candidate-package.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          mkdir -p work/ci-performance/candidate
          node scripts/smoke-performance.mjs --enforce 2>&1 | tee work/ci-performance/candidate/runtime.log
        env:
          WORKSPACE_SMOKE_EVIDENCE_DIR: work/ci-performance/candidate
      - name: Retain raw reports and screens without application downloads
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-${{ matrix.os }}-${{ github.sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: work/ci-performance/
          if-no-files-found: error
          retention-days: 7

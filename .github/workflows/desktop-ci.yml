name: Desktop development artifacts

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      checks:
        description: Full acceptance or a selected focused failure route
        type: choice
        options: [full, integrated-desktop, integrated-regressions, integrated-layout, integrated-category-layout, integrated-operation-layout, integrated-archive-profile, integrated-runtime, desktop-ux, layout-fixtures, source-inventory, observer-cancellation, observer-workflow, native-owner-controls, native-lifecycle, project-files-windows, project-files-windows-trace, failed, readiness, windows-release, issue22-failures, creation-shutdown, raw-rename, issue24-failures, category-fixture, issue24-startup, multiselect, etw-controls, app-fixture, property-fixture, runtime-observation, view-fixtures, number, windows-property-fixture, rename-authoring, rename-fixture, viewport-runtime, workspace-root-runtime, archive-contexts, creation-ownership, desktop-shell, shell-runtime, views-readiness, view-contexts, workspace-sidebar, workspace-setup, workspace-setup-readiness, select-readiness, source-fixture, source-runtime]
        default: full
      desktop_ux_profile:
        description: With desktop-ux, select foundation, grouped Board or project navigation acceptance
        type: choice
        options: [foundation, recovery-settings, filesystem-assignment-recovery-renewal, filesystem-assignment-integration, retained-recovery, contextual-categories, contextual-archive, contextual-archive-native, board, contextual-projects, contextual-project-regressions, filesystem-assignment-reveal-repair, filesystem-assignment-tail, filesystem-assignment-repair, filesystem-assignment, group-assignment, navigation, navigation-native, scroll-restoration, project-files, project-files-native, coherent, sessions, scalars, selections, properties, property-repair, property-tail, property-renewal, selection-native, selection-focus, selection-tail]
        default: foundation
      desktop_ux_failure_probe:
        description: With desktop-ux, deliberately fail a selected check to verify propagation
        type: boolean
        default: false
      desktop_ux_packaged_only:
        description: With desktop-ux, renew packaged consumers after unchanged source acceptance
        type: boolean
        default: false
      desktop_ux_category_only:
        description: With desktop-ux, renew only failed Windows latest category runtime
        type: boolean
        default: false
      desktop_ux_category_quit_trace:
        description: With category-only, collect read-only quit phases as diagnostic evidence
        type: boolean
        default: false
      source_runtime_platform:
        description: With checks=source-runtime, renew missing runtime tails; all-desktops also renews the missing Windows latest prefix
        type: choice
        options: [all, windows-latest, windows-2022, all-desktops, runtime-tails, package-tails, package-windows-latest]
        default: all
      recovery_windows_2022:
        description: With checks=issue22-failures, replay the backend recovery file on Windows 2022 and the original macOS runtime
        type: boolean
        default: false
      readiness_windows:
        description: With checks=readiness, reproduce original Windows latest and 2022 editor failures
        type: boolean
        default: false
      readiness_native_trace:
        description: Enable bounded native read tracing for focused Windows diagnosis; cold acceptance defaults off
        type: boolean
        default: false
      readiness_native_prefix:
        description: With readiness native Windows, reproduce the original layout and creation prefix before the failed command
        type: boolean
        default: false
      readiness_native_early:
        description: With readiness native Windows, run native acceptance before the retained desktop prefix
        type: boolean
        default: false
      readiness_native_windows:
        description: With checks=readiness and readiness_reveal_windows, also run the original Windows latest direct creation and Reveal command
        type: boolean
        default: false
      readiness_reveal_windows:
        description: With checks=readiness, run the original Reveal regression file on both Windows runners instead of editor tests
        type: boolean
        default: false
      readiness_package_creation:
        description: With checks=readiness, reproduce original macOS grouped packaged creation and Reveal failure
        type: boolean
        default: false
      category_fixture_only:
        description: With checks=category-fixture, run only the Windows latest checkpoint regression
        type: boolean
        default: false
      startup_category_only:
        description: With checks=issue24-startup, focus a remaining category failure after unchanged readiness success
        type: boolean
        default: false
      raw_windows_only:
        description: With checks=raw-rename, run only the remaining Windows failure after macOS focused success
        type: boolean
        default: false
      raw_renderer_check:
        description: With checks=raw-rename, also verify the original macOS App fixture after the local initial-list failure
        type: boolean
        default: false
      diagnostics:
        description: Run isolated investigation and early-feedback jobs
        type: boolean
        default: false
      observer_fixture_only:
        description: With checks=failed, run only the original Windows observer files without the unrelated macOS rename runtime
        type: boolean
        default: false
      runtime_failures:
        description: With checks=failed, diagnose the Windows creation Reveal and external category rename failures
        type: boolean
        default: false
      integration_failures:
        description: With checks=failed, run category layouts on macOS and direct creation Reveal on Windows 2022
        type: boolean
        default: false
      category_layout_only:
        description: With checks=failed and integration_failures, run only the original failed category layouts on all three platforms
        type: boolean
        default: false
      legacy_windows_diagnostics:
        description: Run historical unused Windows API and CLI comparisons (known negative outcomes)
        type: boolean
        default: false

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-project-files-windows:
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.checks == 'project-files-windows' || inputs.checks == 'project-files-windows-trace') }}
    uses: ./.github/workflows/project-files-windows.yml
    with:
      trace: ${{ inputs.checks == 'project-files-windows-trace' }}
  layout-fixtures:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.checks == 'layout-fixtures' }}
    name: Original shared Ladle layouts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.21.1
          cache: npm
      - run: npm ci
      - name: Record original layout provenance
        shell: bash
        run: |
          mkdir -p work/ci-all-layouts
          node --input-type=module -e 'import { writeFileSync } from "node:fs"; writeFileSync("work/ci-all-layouts/provenance.json", JSON.stringify({sha:process.env.GITHUB_SHA,run:process.env.GITHUB_RUN_ID,attempt:process.env.GITHUB_RUN_ATTEMPT,platform:process.platform}) + "\n")'
      - run: npm run build:renderer
      - run: node -e "require('electron')"
      - run: node --test tests/category-header-layout-native.test.mjs tests/view-scroll-native.test.mjs
      - run: npm run build:ladle
      - run: node scripts/smoke-discovery-layouts.mjs
        env:
          WORKSPACE_SMOKE_EVIDENCE_DIR: work/ci-all-layouts
      - name: Preserve original layout result including failure geometry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layout-fixtures-${{ matrix.os }}-${{ github.sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: work/ci-all-layouts/
          if-no-files-found: error

  source-inventory:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.checks == 'source-inventory' }}
    name: Original source continuation inventory (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.21.1
          cache: npm
      - run: npm ci
      - name: Original failed continuation guard and companion controls
        shell: bash
        run: |
          set -o pipefail
          mkdir -p work/ci-source-inventory
          node --input-type=module -e 'import { writeFileSync } from "node:fs"; writeFileSync("work/ci-source-inventory/provenance.json", JSON.stringify({sha:process.env.GITHUB_SHA,run:process.env.GITHUB_RUN_ID,attempt:process.env.GITHUB_RUN_ATTEMPT,platform:process.platform}) + "\n")'
          node --test tests/runtime-workspace-identity.test.mjs tests/test-suites.test.mjs tests/windows-product-diagnostics.test.mjs tests/windows-native-view-diagnostics.test.mjs tests/windows-process-owner.test.mjs 2>&1 | tee work/ci-source-inventory/tests.log
      - name: Preserve source inventory outcomes including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-inventory-${{ matrix.os }}-${{ github.sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: work/ci-source-inventory/
          if-no-files-found: error

  observer-cancellation:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.checks == 'observer-cancellation' }}
    name: Original observer cancellation and publication (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.21.1
          cache: npm
      - run: npm ci
      - name: Original observer file including partial-publication regression
        shell: bash
        run: |
          set -o pipefail
          mkdir -p work/ci-observer-cancellation
          node --input-type=module -e 'import { writeFileSync } from "node:fs"; writeFileSync("work/ci-observer-cancellation/provenance.json", JSON.stringify({sha:process.env.GITHUB_SHA,run:process.env.GITHUB_RUN_ID,attempt:process.env.GITHUB_RUN_ATTEMPT,platform:process.platform}) + "\n")'
          node --test tests/ralphex-observe.test.mjs tests/test-suites.test.mjs 2>&1 | tee work/ci-observer-cancellation/tests.log
      - name: Preserve observer cancellation outcomes including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: observer-cancellation-${{ matrix.os }}-${{ github.sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: work/ci-observer-cancellation/
          if-no-files-found: error

  observer-workflow:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.checks == 'observer-workflow' }}
    name: Original observer workflow controls (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.21.1
          cache: npm
      - run: npm ci
      - name: Original observer file and workflow inventory
        shell: bash
        run: |
          set -o pipefail
          mkdir -p work/ci-observer-workflow
          node --test tests/windows-observer-diagnostics.test.mjs tests/test-suites.test.mjs 2>&1 | tee work/ci-observer-workflow/tests.log
        env:
          OBSERVER_MATRIX: ${{ matrix.os }}
          WORKSPACE_OBSERVER_CALL_EVIDENCE_DIR: work/ci-observer-workflow/collector
      - name: Validate the original retained collector
        if: always()
        run: node scripts/windows-observer-diagnostics.mjs validate-call --output work/ci-observer-workflow/collector
        env:
          OBSERVER_MATRIX: ${{ matrix.os }}
      - name: Preserve observer workflow outcomes including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: observer-workflow-${{ matrix.os }}-${{ github.sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: work/ci-observer-workflow/
          if-no-files-found: error
  native-owner-controls:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.checks == 'native-owner-controls' }}
    name: Original Windows native owner and terminal UIA controls
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.21.1
      - name: Original terminal UIA file and actual process identity control
        shell: bash
        run: |
          set -o pipefail
          mkdir -p work/ci-native-owner-controls
          node --test tests/windows-native-view-diagnostics.test.mjs tests/windows-process-owner.test.mjs 2>&1 | tee work/ci-native-owner-controls/tests.log
      - name: Preserve original native control outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-owner-controls-${{ github.sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: work/ci-native-owner-controls/
          if-no-files-found: error
  focused-native-lifecycle:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.checks == 'native-lifecycle' }}
    uses: ./.github/workflows/native-lifecycle.yml
    with:
      platform: all
  desktop-ux:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.checks == 'desktop-ux' }}
    name: Desktop UX foundation (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.desktop_ux_profile == 'filesystem-assignment-reveal-repair' && '["windows-latest"]' || inputs.desktop_ux_profile == 'filesystem-assignment-repair' && '["macos-latest","windows-latest"]' || inputs.desktop_ux_profile == 'contextual-archive-native' && '["windows-latest","windows-2022"]' || inputs.desktop_ux_profile == 'property-repair' && '["macos-latest","windows-latest"]' || inputs.desktop_ux_profile == 'selection-focus' && '["macos-latest"]' || inputs.desktop_ux_profile == 'selection-tail' && '["macos-latest","windows-latest"]' || inputs.desktop_ux_profile == 'navigation-native' && '["windows-latest","windows-2022"]' || inputs.desktop_ux_category_only && '["windows-latest"]' || '["macos-latest","windows-latest","windows-2022"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.21.1
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Candidate provenance
        env:
          WORKSPACE_UX_PROFILE: ${{ inputs.desktop_ux_profile || 'foundation' }}
          WORKSPACE_UX_NAVIGATION_ONLY: ${{ (inputs.desktop_ux_profile == 'navigation-native' || inputs.desktop_ux_profile == 'scroll-restoration') && '1' || '0' }}
        shell: bash
        run: |
          mkdir -p work/ci-desktop-ux
          node --input-type=module -e 'import {writeFileSync} from "node:fs"; writeFileSync("work/ci-desktop-ux/provenance.json", JSON.stringify({sha:process.env.GITHUB_SHA,run:process.env.GITHUB_RUN_ID,attempt:process.env.GITHUB_RUN_ATTEMPT,platform:process.platform,profile:process.env.WORKSPACE_UX_PROFILE,navigationOnly:process.env.WORKSPACE_UX_NAVIGATION_ONLY==="1"}))'
      - name: Verify selected-check failure propagation
        if: ${{ inputs.desktop_ux_failure_probe }}
        run: node scripts/desktop-ux-checks.mjs foundation --failure-probe
      - name: Affected UI, services and real Electron flows
        if: ${{ !inputs.desktop_ux_failure_probe && !inputs.desktop_ux_packaged_only && !inputs.desktop_ux_category_only && inputs.desktop_ux_profile != 'recovery-settings' && inputs.desktop_ux_profile != 'board' && inputs.desktop_ux_profile != 'navigation' && inputs.desktop_ux_profile != 'navigation-native' && inputs.desktop_ux_profile != 'scroll-restoration' && inputs.desktop_ux_profile != 'project-files' && inputs.desktop_ux_profile != 'project-files-native' && inputs.desktop_ux_profile != 'coherent' && inputs.desktop_ux_profile != 'sessions' && inputs.desktop_ux_profile != 'scalars' && inputs.desktop_ux_profile != 'selections' && inputs.desktop_ux_profile != 'selection-native' && inputs.desktop_ux_profile != 'selection-tail' && inputs.desktop_ux_profile != 'selection-focus' && inputs.desktop_ux_profile != 'contextual-project-regressions' && inputs.desktop_ux_profile != 'contextual-projects' && inputs.desktop_ux_profile != 'contextual-categories' && inputs.desktop_ux_profile != 'retained-recovery' && inputs.desktop_ux_profile != 'filesystem-assignment-integration' && inputs.desktop_ux_profile != 'filesystem-assignment-recovery-renewal' && inputs.desktop_ux_profile != 'contextual-archive' && inputs.desktop_ux_profile != 'contextual-archive-native' && inputs.desktop_ux_profile != 'filesystem-assignment-reveal-repair' && inputs.desktop_ux_profile != 'filesystem-assignment-tail' && inputs.desktop_ux_profile != 'filesystem-assignment-repair' && inputs.desktop_ux_profile != 'filesystem-assignment' && inputs.desktop_ux_profile != 'group-assignment' && inputs.desktop_ux_profile != 'properties' && inputs.desktop_ux_profile != 'property-repair' && inputs.desktop_ux_profile != 'property-tail' && inputs.desktop_ux_profile != 'property-renewal' }}
        run: npm run test:desktop-ux
      - name: Renew changed filesystem assignment and unreached native tails
        if: ${{ !inputs.desktop_ux_failure_probe && inputs.desktop_ux_profile == 'filesystem-assignment-tail' }}
        run: node scripts/desktop-ux-checks.mjs filesystem-assignment-tail
      - name: Original macOS filesystem assignment visibility renewal
        if: ${{ !inputs.desktop_ux_failure_probe && inputs.desktop_ux_profile == 'filesystem-assignment-repair' && matrix.os == 'macos-latest' }}
        run: node scripts/desktop-ux-checks.mjs filesystem-assignment-repair
      - name: Original Windows latest Reveal contract validation
        if: ${{ !inputs.desktop_ux_failure_probe && (inputs.desktop_ux_profile == 'filesystem-assignment-repair' || inputs.desktop_ux_profile == 'filesystem-assignment-reveal-repair') && matrix.os == 'windows-latest' }}
        run: node scripts/desktop-ux-checks.mjs filesystem-assignment-reveal
        env:
          WORKSPACE_REVEAL_TRACE: '0'
      - name: Original Windows latest rename Reveal diagnostic
        if: ${{ !inputs.desktop_ux_failure_probe && (inputs.desktop_ux_profile == 'filesystem-assignment-repair' || inputs.desktop_ux_profile == 'filesystem-assignment-reveal-repair') && matrix.os == 'windows-latest' }}
        run: npm run smoke:runtime -- dev --rename
        env:
          WORKSPACE_REVEAL_TRACE: '1'
      - name: Original Windows latest rename Reveal strict renewal
        if: ${{ !inputs.desktop_ux_failure_probe && (inputs.desktop_ux_profile == 'filesystem-assignment-repair' || inputs.desktop_ux_profile == 'filesystem-assignment-reveal-repair') && matrix.os == 'windows-latest' }}
        run: npm run smoke:runtime -- dev --rename
        env:
          WORKSPACE_REVEAL_TRACE: '0'
      - name: Recovery driver and missing release acceptance renewal
        if: ${{ !inputs.desktop_ux_failure_probe && inputs.desktop_ux_profile == 'filesystem-assignment-recovery-renewal' }}
        run: node scripts/desktop-ux-checks.mjs filesystem-assignment-recovery-renewal
      - name: Integrated assignment and retained recovery acceptance
        if: ${{ !inputs.desktop_ux_failure_probe && inputs.desktop_ux_profile == 'filesystem-assignment-integration' }}
        run: node scripts/desktop-ux-checks.mjs filesystem-assignment-integration
      - name: Filesystem group assignment and inherited all-type consumers
        if: ${{ !inputs.desktop_ux_failure_probe && inputs.desktop_ux_profile == 'filesystem-assignment' }}
        run: node scripts/desktop-ux-checks.mjs filesystem-assignment
      - name: Selection driver regression and original native command renewal
        if: ${{ !inputs.desktop_ux_failure_probe && inputs.desktop_ux_profile == 'selection-native' }}
        run: node scripts/desktop-ux-checks.mjs selection-native
        env:
          WORKSPACE_SELECTION_VIEWS_RENEW: ${{ matrix.os == 'windows-2022' && '1' || '0' }}
      - name: Original macOS MultiSelect focus-return renewal
        if: ${{ !inputs.desktop_ux_failure_probe && inputs.desktop_ux_profile == 'selection-focus' }}
        run: node scripts/desktop-ux-checks.mjs selection-focus
      - name: Unreached selection scalar and saved-view consumers
        if: ${{ !inputs.desktop_ux_failure_probe && inputs.desktop_ux_profile == 'selection-tail' }}
        run: node scripts/desktop-ux-checks.mjs selection-tail
      - name: Original property view-switch and Views focus failures
        if: ${{ !inputs.desktop_ux_failure_probe && inputs.desktop_ux_profile == 'property-repair' }}
        run: node scripts/desktop-ux-checks.mjs property-repair
      - name: Changed Windows MultiSelect and unreached macOS Views
        if: ${{ !inputs.desktop_ux_failure_probe && inputs.desktop_ux_profile == 'property-renewal' }}
        run: node scripts/desktop-ux-checks.mjs property-renewal
        env:
          WORKSPACE_PROPERTY_VIEWS_RENEW: ${{ matrix.os == 'windows-latest' && '1' || '0' }}
      - name: Remaining and changed property driver consumers
        if: ${{ !inputs.desktop_ux_failure_probe && inputs.desktop_ux_profile == 'property-tail' }}
        run: node scripts/desktop-ux-checks.mjs property-tail
        env:
          WORKSPACE_PROPERTY_VIEWS_RENEW: ${{ matrix.os == 'windows-2022' && '1' || '0' }}
      - name: Contextual property definitions and reviewed metadata removal
        if: ${{ !inputs.desktop_ux_failure_probe && inputs.desktop_ux_profile == 'properties' }}
        run: node scripts/desktop-ux-checks.mjs properties
      - name: Contextual inherited DOM regression renewal
        if: ${{ !inputs.desktop_ux_failure_probe && inputs.desktop_ux_profile == 'contextual-project-regressions' }}
        run: node scripts/desktop-ux-checks.mjs contextual-project-regressions
      - name: Contextual project operations and original native packaged consumers
        if: ${{ !inputs.desktop_ux_failure_probe && inputs.desktop_ux_profile == 'contextual-projects' }}
        run: node scripts/desktop-ux-checks.mjs contextual-projects
      - name: Retained project status, reviewed recovery and session restart
        if: ${{ !inputs.desktop_ux_failure_probe && inputs.desktop_ux_profile == 'retained-recovery' }}
        run: node scripts/desktop-ux-checks.mjs retained-recovery
      - name: Original Windows contextual archive command and editor readiness control
        if: ${{ !inputs.desktop_ux_failure_probe && inputs.desktop_ux_profile == 'contextual-archive-native' }}
        run: node scripts/desktop-ux-checks.mjs contextual-archive-native
      - name: Contextual archive and original restart recovery consumers
        if: ${{ !inputs.desktop_ux_failure_probe && inputs.desktop_ux_profile == 'contextual-archive' }}
        run: node scripts/desktop-ux-checks.mjs contextual-archive
      - name: Contextual folder-backed categories
        if: ${{ !inputs.desktop_ux_failure_probe && inputs.desktop_ux_profile == 'contextual-categories' }}
        run: node scripts/desktop-ux-checks.mjs contextual-categories
      - name: Ordinary group assignment and retained all-type Views consumers
        if: ${{ !inputs.desktop_ux_failure_probe && inputs.desktop_ux_profile == 'group-assignment' }}
        run: node scripts/desktop-ux-checks.mjs group-assignment
      - name: Immediate selections, option controls and guarded navigation acceptance
        if: ${{ !inputs.desktop_ux_failure_probe && inputs.desktop_ux_profile == 'selections' }}
        run: node scripts/desktop-ux-checks.mjs selections
      - name: Scalar drafts and guarded navigation acceptance
        if: ${{ !inputs.desktop_ux_failure_probe && inputs.desktop_ux_profile == 'scalars' }}
        run: node scripts/desktop-ux-checks.mjs scalars
      - name: Recovery settings, notices and current-session return
        if: ${{ !inputs.desktop_ux_failure_probe && inputs.desktop_ux_profile == 'recovery-settings' }}
        run: node scripts/desktop-ux-checks.mjs recovery-settings
      - name: Workspace session migration, recovery and real restart acceptance
        if: ${{ !inputs.desktop_ux_failure_probe && inputs.desktop_ux_profile == 'sessions' }}
        run: node scripts/desktop-ux-checks.mjs sessions
      - name: Coherent desktop principal journeys and retained guarantees
        if: ${{ !inputs.desktop_ux_failure_probe && !inputs.desktop_ux_packaged_only && !inputs.desktop_ux_category_only && inputs.desktop_ux_profile == 'coherent' }}
        run: node scripts/desktop-ux-checks.mjs coherent
      - name: Grouped Board appearance, behavior and retained service guarantees
        if: ${{ !inputs.desktop_ux_failure_probe && inputs.desktop_ux_profile == 'board' }}
        run: node scripts/desktop-ux-checks.mjs board
      - name: Project navigation and shared shell acceptance
        if: ${{ !inputs.desktop_ux_failure_probe && inputs.desktop_ux_profile == 'navigation' }}
        run: node scripts/desktop-ux-checks.mjs navigation
      - name: Real project files and native Open/Reveal acceptance
        if: ${{ !inputs.desktop_ux_failure_probe && inputs.desktop_ux_profile == 'project-files' }}
        run: node scripts/desktop-ux-checks.mjs project-files
      - name: Focused project files and Views native renewal
        if: ${{ !inputs.desktop_ux_failure_probe && inputs.desktop_ux_profile == 'project-files-native' }}
        run: node scripts/desktop-ux-checks.mjs project-files --native-only
      - name: Focused project navigation native renewal
        if: ${{ !inputs.desktop_ux_failure_probe && (inputs.desktop_ux_profile == 'navigation-native' || inputs.desktop_ux_profile == 'scroll-restoration') }}
        run: node scripts/desktop-ux-checks.mjs navigation --native-only
      - name: Packaged renewal adapter regressions
        if: ${{ (inputs.desktop_ux_packaged_only || inputs.desktop_ux_category_only) && !inputs.desktop_ux_failure_probe }}
        run: node --import tsx --test tests/runtime-layout.test.mjs tests/runtime-readiness.test.mjs tests/desktop-ux-checks.test.mjs tests/rename-submission-receipt.test.mjs tests/project-category-move-runtime.test.mjs tests/runtime-quit-evidence.test.mjs
      - name: Package shared font and notices

name: Desktop development artifacts

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      checks:
        description: Full acceptance or a selected focused failure route
        type: choice
        options: [full, failed, readiness]
        default: full
      diagnostics:
        description: Run isolated investigation and early-feedback jobs
        type: boolean
        default: false
      runtime_failures:
        description: With checks=failed, diagnose the Windows creation Reveal and external category rename failures
        type: boolean
        default: false
      integration_failures:
        description: With checks=failed, run category layouts on macOS and direct creation Reveal on Windows 2022
        type: boolean
        default: false
      legacy_windows_diagnostics:
        description: Run historical unused Windows API and CLI comparisons (known negative outcomes)
        type: boolean
        default: false

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  common:
    if: ${{ github.event_name != 'workflow_dispatch' || (inputs.checks != 'failed' && inputs.checks != 'readiness') }}
    name: Common tests and static checks
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.21.1
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check:docs
      - run: npm run test:common

  focused-macos-readiness:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.checks == 'readiness' }}
    name: Focused macOS editor readiness
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.21.1
          cache: npm
      - run: npm ci
      - name: Run original readiness suite
        shell: bash
        run: |
          set -o pipefail
          mkdir -p work/ci-focused-readiness
          node --test tests/rename-editor-readiness.test.mjs 2>&1 | tee work/ci-focused-readiness/tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue-21-focused-readiness-${{ github.sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: work/ci-focused-readiness/
          if-no-files-found: error
          retention-days: 7

  focused-windows-observer:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.checks == 'failed' && inputs.runtime_failures != true && inputs.integration_failures != true }}
    name: Focused Windows observer checks
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      OBSERVER_MATRIX: windows-latest
      WORKSPACE_OBSERVER_CALL_EVIDENCE_DIR: work/ci-focused-observer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.21.1
          cache: npm
      - run: npm ci
      - run: node --test tests/ralphex-observe.test.mjs tests/ralphex-run.test.mjs tests/windows-observer-diagnostics.test.mjs
      - name: Validate original focused observer evidence
        id: focused-observer-validation
        if: always()
        run: node scripts/windows-observer-diagnostics.mjs validate-call --output work/ci-focused-observer
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.focused-observer-validation.outcome == 'success' }}
        with:
          name: issue-19-focused-observer-windows-latest-${{ github.sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: work/ci-focused-observer/collector.json
          if-no-files-found: error
          retention-days: 7

  focused-macos-rename:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.checks == 'failed' && inputs.runtime_failures != true && inputs.integration_failures != true }}
    name: Focused macOS rename and Reveal
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.21.1
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run smoke:runtime -- dev --rename
        env:
          WORKSPACE_SMOKE_EVIDENCE_DIR: work/ci-focused-rename
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue-19-focused-rename-macos-latest-${{ github.sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: work/ci-focused-rename/
          if-no-files-found: error
          retention-days: 7

  focused-integration-layout:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.checks == 'failed' && inputs.integration_failures == true }}
    name: Focused macOS category layouts
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.21.1
          cache: npm
      - run: npm ci
      - run: node --import tsx --test tests/project-category-move-ui.test.tsx
      - run: npm run build:ladle
      - run: node scripts/smoke-discovery-layouts.mjs --category-move
        env:
          WORKSPACE_SMOKE_EVIDENCE_DIR: work/ci-focused-integration-layout
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue-19-focused-integration-layout-${{ github.sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: work/ci-focused-integration-layout/
          if-no-files-found: error
          retention-days: 7

  focused-integration-reveal:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.checks == 'failed' && inputs.integration_failures == true }}
    name: Focused Windows 2022 direct creation Reveal
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.21.1
          cache: npm
      - run: npm ci
      - run: npm run build
        id: integration-build
      - run: node --import tsx --test tests/windows-project-reveal.test.mjs tests/windows-project-reveal-com.test.mjs
      - name: Exercise original Windows 2022 direct creation failure
        if: ${{ !cancelled() && steps.integration-build.outcome == 'success' }}
        run: npm run smoke:runtime -- dev --creation --discovery-mode=direct --checkpoint=after_evidence
        env:
          WORKSPACE_SMOKE_EVIDENCE_DIR: work/ci-focused-integration-reveal
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue-19-focused-integration-reveal-${{ github.sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: work/ci-focused-integration-reveal/
          if-no-files-found: error
          retention-days: 7

  focused-windows-runtime:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.checks == 'failed' && inputs.runtime_failures == true && inputs.integration_failures != true }}
    name: Focused Windows runtime failure (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            command: npm run smoke:runtime -- dev --creation --discovery-mode=direct --checkpoint=after_evidence
          - os: windows-2022
            command: npm run smoke:runtime -- dev
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.21.1
          cache: npm
      - run: npm ci
      - run: npm run build
        id: runtime-build
      - name: Compare real-service category rename and controlled sharing failures
        if: matrix.os == 'windows-2022'
        run: node --import tsx scripts/windows-rename-diagnostics.mjs
        env:
          WORKSPACE_RENAME_EVIDENCE_DIR: work/ci-focused-runtime/rename-diagnostic
      - name: Exercise the original failed runtime route
        if: ${{ !cancelled() && steps.runtime-build.outcome == 'success' }}
        run: ${{ matrix.command }}
        env:
          WORKSPACE_SMOKE_EVIDENCE_DIR: work/ci-focused-runtime/scenario
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue-19-focused-runtime-${{ matrix.os }}-${{ github.sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: work/ci-focused-runtime/
          if-no-files-found: error
          retention-days: 7

  windows-observer-diagnostic:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnostics == true }}
    name: Isolated pure-Node observer diagnostic (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    env:
      OBSERVER_MATRIX: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.21.1
      - name: Initialize finite unreached diagnostic and test status
        id: evidence
        run: node scripts/windows-observer-diagnostics.mjs prepare --output work/ci-windows-observer
        timeout-minutes: 1
      - name: Compare owned observer identities and read-only process probes
        run: node scripts/windows-observer-diagnostics.mjs diagnostic --output work/ci-windows-observer/diagnostic.json
        timeout-minutes: 1
      - name: Run focused observer runner and diagnostic regressions with actual test exit
        if: ${{ always() && steps.evidence.outcome == 'success' }}
        run: node scripts/windows-observer-diagnostics.mjs tests --output work/ci-windows-observer/test-status.json
        timeout-minutes: 2
      - name: Require both finite documents with matching checkout provenance
        if: always()
        run: node scripts/windows-observer-diagnostics.mjs validate --output work/ci-windows-observer
        timeout-minutes: 1
      - name: Preserve only sanitized observer evidence including anomalies
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-19-observer-diagnostic-${{ matrix.os }}-${{ github.sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: work/ci-windows-observer/diagnostic.json
          if-no-files-found: error
          retention-days: 7
      - name: Preserve only finite focused test status including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-19-observer-tests-${{ matrix.os }}-${{ github.sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: work/ci-windows-observer/test-status.json
          if-no-files-found: error
          retention-days: 7

  project-category-move-service-early:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnostics == true }}
    name: Early real-service project category move (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.21.1
          cache: npm
      - run: npm ci
      - name: Build production service and native inputs
        run: npm run build
      - name: Check focused journal coordination recovery transport and fixture controls
        run: npm run test:category-move:early
        env:
          WORKSPACE_CATEGORY_MOVE_SERVICE_EVIDENCE_DIR: work/ci-category-move-service-controls
      - name: Observe production service in Electron before unrelated UI or Reveal work
        if: ${{ !cancelled() }}
        run: npm run smoke:category-move:service
        timeout-minutes: 2
        env:
          WORKSPACE_CATEGORY_MOVE_SERVICE_EVIDENCE_DIR: work/ci-category-move-service
      - name: Preserve separate service checkpoint including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-19-category-move-service-${{ matrix.os }}
          path: |
            work/ci-category-move-service/
            work/ci-category-move-service-controls/
          if-no-files-found: warn

  project-rename-service-early:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnostics == true }}
    name: Early real-service project rename (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.21.1
          cache: npm
      - run: npm ci
      - name: Build production service and native inputs
        run: npm run build
      - name: Check focused journal coordination recovery transport and fixture controls
        run: npm run test:rename:early
        env:
          WORKSPACE_RENAME_SERVICE_EVIDENCE_DIR: work/ci-rename-service-controls
      - name: Observe production service in Electron before unrelated UI or Reveal work
        if: ${{ !cancelled() }}
        run: npm run smoke:rename:service
        timeout-minutes: 2
        env:
          WORKSPACE_RENAME_SERVICE_EVIDENCE_DIR: work/ci-rename-service
      - name: Preserve separate service checkpoint including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-18-rename-service-${{ matrix.os }}
          path: |
            work/ci-rename-service/
            work/ci-rename-service-controls/
          if-no-files-found: warn

  windows-product-selection-diagnostic:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnostics == true }}
    name: Isolated Windows product selection diagnostic
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.21.1
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check creation IPC and Windows bridge before native acceptance
        run: npm run test:windows:early
        env:
          WORKSPACE_RENAME_NATIVE_EVIDENCE_DIR: work/ci-windows-rename-native
      - name: Observe one immediate product Reveal with COM and UI Automation
        id: native
        run: node scripts/smoke-project-creation.mjs dev --discovery-mode=direct --checkpoint=after_evidence
        timeout-minutes: 3
        env:
          WORKSPACE_WINDOWS_SELECTION_DIAGNOSTIC: '1'
          WORKSPACE_SMOKE_EVIDENCE_DIR: work/ci-windows-product-selection
      - name: Preserve strict product selection diagnostic including failures
        if: ${{ always() && steps.native.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: issue-17-windows-product-selection-diagnostic
          path: work/ci-windows-product-selection/result.json
          if-no-files-found: error
      - name: Preserve early rename adapter outcomes including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-18-windows-rename-native
          path: work/ci-windows-rename-native/native-adapter.json
          if-no-files-found: warn

  windows-category-rename-diagnostic:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnostics == true }}
    name: Isolated Windows real-service category rename diagnostic
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.21.1
          cache: npm
      - run: npm ci
      - run: npm run build:service-test-lib
      - name: Compare distinct idle observed scanning and conflict fixtures
        run: node --import tsx scripts/windows-rename-diagnostics.mjs
        timeout-minutes: 5
        env:
          WORKSPACE_RENAME_EVIDENCE_DIR: work/ci-windows-category-rename
      - name: Verify real-service diagnostic and negative-result retention
        if: always()
        run: node --import tsx --test tests/windows-rename-diagnostics.test.mjs
      - name: Preserve strict category rename diagnostic including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-17-windows-category-rename-diagnostic
          path: work/ci-windows-category-rename/rename-observations.json
          if-no-files-found: error

  windows-native-selection:
    name: Historical manual Windows API owned-view diagnostic (${{ matrix.os }})
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.legacy_windows_diagnostics == true }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.21.1
      - name: Invoke one native selection on an owned Unicode fixture
        run: node scripts/windows-native-selection.mjs
        env:
          WORKSPACE_NATIVE_SELECTION_MODE: electron_absolute
          WORKSPACE_NATIVE_VIEW_DIAGNOSTIC: '1'
      - name: Verify controlled bridge, protocol, observation and cleanup boundaries
        if: always()
        run: node --test tests/windows-native-selection.test.mjs tests/windows-native-view-diagnostics.test.mjs tests/windows-selection-diagnostics.test.mjs tests/file-manager-evidence.test.mjs
      - name: Preserve separate native selection experiment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-17-windows-native-terminal-view-${{ matrix.os }}
          path: work/windows-native-selection-evidence/result.json
          if-no-files-found: error

  windows-explorer-selection:
    name: Historical manual Explorer command-line diagnostic (${{ matrix.os }})
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.legacy_windows_diagnostics == true }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.21.1
      - name: Launch Explorer once on an owned literal Unicode target
        run: node scripts/windows-explorer-selection.mjs
      - name: Verify controlled argument transport lifecycle and exact observer
        if: always()
        run: node --test tests/windows-explorer-selection.test.mjs tests/file-manager-evidence.test.mjs
      - name: Preserve CLI candidate evidence including negative and unavailable outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-17-windows-explorer-select-${{ matrix.os }}
          path: work/windows-explorer-selection-evidence/result.json
          if-no-files-found: error

  verify:
    needs: common
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: macos
          - os: windows-latest
            artifact: windows
          - os: windows-2022
            artifact: windows-2022
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.21.1
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:platform
        env:
          OBSERVER_MATRIX: ${{ matrix.os }}
          WORKSPACE_OBSERVER_CALL_EVIDENCE_DIR: work/ci-observer-full-suite
          WORKSPACE_CATEGORY_MOVE_SERVICE_EVIDENCE_DIR: work/ci-category-move-full-suite/${{ matrix.os }}-${{ github.sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
      - name: Validate the original full-suite collector document
        id: observer-call-validation
        if: always()
        run: node scripts/windows-observer-diagnostics.mjs validate-call --output work/ci-observer-full-suite
        env:
          OBSERVER_MATRIX: ${{ matrix.os }}
      - name: Preserve the validated original collector call including failures
        if: ${{ always() && steps.observer-call-validation.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: issue-19-observer-full-suite-${{ matrix.os }}-${{ github.sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: work/ci-observer-full-suite/collector.json
          if-no-files-found: error
          retention-days: 7
      - name: Preserve sanitized category checkpoints from the original full suite
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-19-category-move-full-suite-${{ matrix.os }}-${{ github.sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: work/ci-category-move-full-suite/${{ matrix.os }}-${{ github.sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}/*/service-checkpoint.json
          if-no-files-found: warn
          retention-days: 7
      - run: npm run build:ladle
      - name: Capture creation/recovery/Reveal layouts
        run: node scripts/smoke-discovery-layouts.mjs --creation
        env:
          WORKSPACE_SMOKE_EVIDENCE_DIR: work/ci-creation-layouts
      - name: Capture category move/status/recovery layouts
        run: node scripts/smoke-discovery-layouts.mjs --category-move
        env:
          WORKSPACE_SMOKE_EVIDENCE_DIR: work/ci-category-move-layouts
      - name: Development creation crash/recovery matrix
        run: npm run smoke:runtime -- dev --creation --skip-native
        env:
          WORKSPACE_SMOKE_EVIDENCE_DIR: work/ci-creation-dev-crash-matrix
      - name: Direct development creation/native evidence
        run: npm run smoke:runtime -- dev --creation --discovery-mode=direct --checkpoint=after_evidence
        env:
          WORKSPACE_SMOKE_EVIDENCE_DIR: work/ci-creation-dev-direct
      - name: Grouped development creation/native evidence
        run: npm run smoke:runtime -- dev --creation --discovery-mode=grouped --checkpoint=after_evidence
        env:
          WORKSPACE_SMOKE_EVIDENCE_DIR: work/ci-creation-dev-grouped
      - run: npm run smoke:runtime -- dev
        env:
          WORKSPACE_SMOKE_EVIDENCE_DIR: work/ci-runtime-dev
      - name: Development category options UI and persistence
        run: npm run smoke:category-options -- dev
        env:
          WORKSPACE_SMOKE_EVIDENCE_DIR: work/ci-category-options-dev
      - run: npm run package:built
      - run: npm run check:artifact -- release
      - name: Packaged category options UI and persistence
        run: npm run smoke:category-options -- release
        env:
          WORKSPACE_SMOKE_EVIDENCE_DIR: work/ci-category-options-release
      - name: Packaged creation crash/recovery matrix
        run: npm run smoke:runtime -- release --creation --skip-native
        env:
          WORKSPACE_SMOKE_EVIDENCE_DIR: work/ci-creation-release-crash-matrix
      - name: Direct packaged creation/native evidence
        run: npm run smoke:runtime -- release --creation --discovery-mode=direct --checkpoint=after_evidence
        env:
          WORKSPACE_SMOKE_EVIDENCE_DIR: work/ci-creation-release-direct
      - name: Grouped packaged creation/native evidence
        run: npm run smoke:runtime -- release --creation --discovery-mode=grouped --checkpoint=after_evidence
        env:
          WORKSPACE_SMOKE_EVIDENCE_DIR: work/ci-creation-release-grouped
      - run: npm run smoke:runtime -- release
        env:
          WORKSPACE_SMOKE_EVIDENCE_DIR: work/ci-runtime-release
      - name: Preserve creation/native and category UI failures and unreached stages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-17-${{ matrix.artifact }}-evidence
          path: |
            work/ci-creation-*/
            work/ci-runtime-*/
            work/ci-category-move-layouts/
            work/ci-category-options-*/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: workspace-${{ matrix.artifact }}-development
          path: release/
          if-no-files-found: error

  windows-ready-selection:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnostics == true }}
    name: Isolated ready-parent native-command diagnostic (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.21.1
      - name: Open one owned parent and select once only after exact readiness
        run: node scripts/windows-ready-selection.mjs
      - name: Sample the read-only system resolver independently
        if: always()
        run: node scripts/windows-resolver-diagnosis.mjs
      - name: Verify bounded resolver observation and read-only series controls
        if: always()
        run: node --test tests/windows-explorer-selection.test.mjs tests/windows-resolver-diagnosis.test.mjs
      - name: Verify controlled command readiness lifetime and cleanup boundaries
        if: always()
        run: node --test tests/windows-ready-selection.test.mjs tests/windows-ready-selection-com.test.mjs tests/file-manager-evidence.test.mjs
      - name: Preserve separate native-command phase and later corroboration
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-17-windows-ready-select-${{ matrix.os }}
          path: work/windows-ready-selection-evidence/result.json
          if-no-files-found: error
      - name: Preserve separate read-only resolver samples
        if: always()
        uses: actions/upload-artifact@v4
        with:

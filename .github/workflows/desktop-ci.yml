        run: npm run build:ladle
      - name: Original predecessor creation layouts
        if: ${{ !cancelled() && steps.reveal-build.outcome == 'success' && inputs.readiness_native_windows == true && inputs.readiness_native_prefix == true && matrix.os == 'windows-latest' }}
        run: node scripts/smoke-discovery-layouts.mjs --creation
        env:
          WORKSPACE_SMOKE_EVIDENCE_DIR: work/ci-focused-windows-reveal/prefix-creation-layouts
      - name: Original predecessor category move layouts
        if: ${{ !cancelled() && steps.reveal-build.outcome == 'success' && inputs.readiness_native_windows == true && inputs.readiness_native_prefix == true && matrix.os == 'windows-latest' }}
        run: node scripts/smoke-discovery-layouts.mjs --category-move

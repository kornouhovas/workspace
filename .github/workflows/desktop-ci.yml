          set -o pipefail
          mkdir -p work/ci-focused-windows-reveal
          node --import tsx --test tests/project-reveal.test.mjs tests/windows-project-reveal.test.mjs tests/windows-project-reveal-com.test.mjs tests/windows-ready-selection-com.test.mjs 2>&1 | tee work/ci-focused-windows-reveal/tests.log

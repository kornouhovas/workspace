name: Desktop development artifacts

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      checks:
        description: Full acceptance or a selected focused failure route
        type: choice
        options: [full, failed, readiness, windows-release, issue22-failures, creation-shutdown, raw-rename, issue24-failures, category-fixture, issue24-startup, multiselect, etw-controls, app-fixture]
        default: full
      readiness_windows:
        description: With checks=readiness, reproduce original Windows latest and 2022 editor failures
        type: boolean
        default: false
      readiness_minimal_host:
        description: Host context for the opt-in minimal Electron native diagnostic
        type: choice
        options:
          - bare
          - workspace
          - source
        default: bare
      readiness_minimal_electron:
        description: With focused Reveal checks, minimize cold native Reveal in Electron without Workspace services
        type: boolean
        default: false
      readiness_native_prefix:
        description: With readiness native Windows, reproduce the original layout and creation prefix before the failed command
        type: boolean
        default: false
      readiness_native_early:
        description: With readiness native Windows, run native acceptance before the retained desktop prefix
        type: boolean
        default: false
      readiness_native_windows:
        description: With checks=readiness and readiness_reveal_windows, also run the original Windows latest direct creation and Reveal command
        type: boolean
        default: false
      readiness_reveal_windows:
        description: With checks=readiness, run the original Reveal regression file on both Windows runners instead of editor tests
        type: boolean
        default: false
      readiness_package_creation:
        description: With checks=readiness, reproduce original macOS grouped packaged creation and Reveal failure
        type: boolean
        default: false
      category_fixture_only:
        description: With checks=category-fixture, run only the Windows latest checkpoint regression
        type: boolean
        default: false
      startup_category_only:
        description: With checks=issue24-startup, focus a remaining category failure after unchanged readiness success
        type: boolean
        default: false
      raw_windows_only:
        description: With checks=raw-rename, run only the remaining Windows failure after macOS focused success
        type: boolean
        default: false
      raw_renderer_check:
        description: With checks=raw-rename, also verify the original macOS App fixture after the local initial-list failure
        type: boolean
        default: false
      diagnostics:
        description: Run isolated investigation and early-feedback jobs
        type: boolean
        default: false
      runtime_failures:
        description: With checks=failed, diagnose the Windows creation Reveal and external category rename failures
        type: boolean
        default: false
      integration_failures:
        description: With checks=failed, run category layouts on macOS and direct creation Reveal on Windows 2022
        type: boolean
        default: false
      legacy_windows_diagnostics:
        description: Run historical unused Windows API and CLI comparisons (known negative outcomes)
        type: boolean
        default: false

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  common:
    if: ${{ github.event_name != 'workflow_dispatch' || (inputs.checks != 'failed' && inputs.checks != 'readiness' && inputs.checks != 'windows-release' && inputs.checks != 'issue22-failures' && inputs.checks != 'creation-shutdown' && inputs.checks != 'raw-rename' && inputs.checks != 'issue24-failures' && inputs.checks != 'category-fixture' && inputs.checks != 'issue24-startup' && inputs.checks != 'multiselect' && inputs.checks != 'etw-controls' && inputs.checks != 'app-fixture') }}
    name: Common tests and static checks
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.21.1
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check:docs
      - run: npm run test:common

  focused-multiselect:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.checks == 'multiselect' }}
    name: Focused macOS packaged MultiSelect
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.21.1
          cache: npm
      - run: npm ci
      - name: Build prerequisites and retain exact-run provenance
        id: build
        shell: bash
        run: |
          set -o pipefail
          mkdir -p work/ci-focused-multiselect
          node --input-type=module -e 'import { writeFileSync } from "node:fs"; writeFileSync("work/ci-focused-multiselect/run.json", JSON.stringify({sha: process.env.GITHUB_SHA, run: process.env.GITHUB_RUN_ID, attempt: process.env.GITHUB_RUN_ATTEMPT, platform: process.platform}) + "\n")'
          npm run build 2>&1 | tee work/ci-focused-multiselect/build.log
      - name: Real Electron loading and MultiSelect regressions
        id: regressions
        shell: bash
        run: |
          set -o pipefail
          node --import tsx --test tests/property-editor-driver.test.mjs tests/multi-select-service.test.mjs tests/multi-select-ui.test.tsx tests/multi-select-ipc.test.mjs tests/test-suites.test.mjs 2>&1 | tee work/ci-focused-multiselect/regressions.log
      - name: Package the original failed application route
        id: package
        if: ${{ always() && steps.build.outcome == 'success' }}
        run: npm run package:built
      - name: Validate packaged resources
        id: artifact
        if: ${{ always() && steps.package.outcome == 'success' }}
        run: npm run check:artifact -- release
      - name: Original macOS packaged MultiSelect EN/RU command
        if: ${{ always() && steps.artifact.outcome == 'success' }}
        run: npm run smoke:multiselect -- release
        env:
          WORKSPACE_SMOKE_EVIDENCE_DIR: work/ci-focused-multiselect/runtime
      - name: Preserve original command, regression and exact-SHA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-26-focused-multiselect-${{ github.sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: work/ci-focused-multiselect/
          if-no-files-found: error
          retention-days: 7

  focused-app-fixture:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.checks == 'app-fixture' }}
    name: Focused Windows 2022 original App fixture
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.21.1
          cache: npm
      - run: npm ci
      - run: npm run build
        id: app-build
      - name: Verify focused route guards
        run: node --import tsx --test tests/test-suites.test.mjs
      - name: Original Windows 2022 App regression file
        if: ${{ !cancelled() && steps.app-build.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          mkdir -p work/ci-focused-app
          node --import tsx --test tests/renderer-app.test.tsx 2>&1 | tee work/ci-focused-app/tests.txt
      - name: Preserve exact-SHA original App result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-26-app-${{ github.sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: work/ci-focused-app/
          if-no-files-found: error

  focused-category-fixture:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.checks == 'category-fixture' }}
    name: Focused Windows latest category checkpoint
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.21.1
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Original category checkpoint regression file
        shell: bash
        run: |
          set -o pipefail
          mkdir -p work/ci-category-fixture
          node --import tsx --test tests/project-category-move-fixture.test.mjs 2>&1 | tee work/ci-category-fixture/tests.txt
        env:
          WORKSPACE_CATEGORY_MOVE_SERVICE_EVIDENCE_DIR: work/ci-category-fixture
      - name: Preserve exact-SHA category checkpoints and original test result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-24-category-fixture-${{ github.sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: work/ci-category-fixture/
          if-no-files-found: error

  focused-rename-runtime:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.checks == 'raw-rename' && !inputs.raw_windows_only }}
    name: Focused macOS original development runtime
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.21.1
          cache: npm
      - id: dependencies
        run: npm ci
      - run: npm run build
      - name: Original failed development runtime command
        shell: bash
        run: |
          set -o pipefail
          mkdir -p work/ci-rename-runtime
          npm run smoke:runtime -- dev 2>&1 | tee work/ci-rename-runtime/tests.txt
        env:
          WORKSPACE_SMOKE_EVIDENCE_DIR: work/ci-rename-runtime
      - name: Original observer CLI cancellation cases
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          mkdir -p work/ci-rename-runtime
          node --test --test-name-pattern='cancelling the actual observer CLI' tests/ralphex-observe.test.mjs 2>&1 | tee work/ci-rename-runtime/cancellation-tests.txt
      - name: Preserve exact-SHA submission receipts and original result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-24-rename-runtime-${{ github.sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: work/ci-rename-runtime/
          if-no-files-found: error

  focused-category-runtime:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.checks == 'category-fixture' && inputs.category_fixture_only != true }}
    name: Focused Windows 2022 original development runtime
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.21.1
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Original failed development runtime command
        shell: bash
        run: |
          set -o pipefail
          mkdir -p work/ci-category-runtime
          npm run smoke:runtime -- dev 2>&1 | tee work/ci-category-runtime/tests.txt
        env:
          WORKSPACE_SMOKE_EVIDENCE_DIR: work/ci-category-runtime
      - name: Preserve exact-SHA runtime proofs and original result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-24-category-runtime-${{ github.sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: work/ci-category-runtime/
          if-no-files-found: error

  focused-issue24-failures:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.checks == 'issue24-failures' }}
    name: Focused issue 24 unit failures (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.21.1
          cache: npm
      - id: dependencies
        run: npm ci
      - name: Original CI scheduling and routing regression file
        shell: bash
        run: |
          set -o pipefail
          mkdir -p work/issue24-failures
          node --test tests/test-suites.test.mjs 2>&1 | tee work/issue24-failures/tests.txt
      - name: Original Windows 2022 runner startup and terminal regressions
        if: ${{ matrix.os == 'windows-2022' && !cancelled() && steps.dependencies.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          mkdir -p work/issue24-failures
          node --test --test-name-pattern='real runner' tests/ralphex-observe.test.mjs 2>&1 | tee work/issue24-failures/runner.txt
      - name: Preserve exact-SHA CI routing results including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-24-issue24-failures-${{ matrix.os }}-${{ github.sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: work/issue24-failures/
          if-no-files-found: error

  focused-issue24-startup:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.checks == 'issue24-startup' }}
    name: Focused Windows latest category and readiness startup
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.21.1
          cache: npm
      - run: npm ci
      - id: build
        run: npm run build
      - name: Original category diagnostic fixture file
        shell: bash
        run: |
          set -o pipefail
          mkdir -p work/ci-issue24-startup
          node --import tsx --test tests/project-category-move-fixture.test.mjs 2>&1 | tee work/ci-issue24-startup/category-tests.txt
        env:
          WORKSPACE_CATEGORY_MOVE_SERVICE_EVIDENCE_DIR: work/ci-issue24-startup/category
      - name: Original Electron readiness fixture file
        if: ${{ !cancelled() && steps.build.outcome == 'success' && !inputs.startup_category_only }}
        shell: bash
        run: |
          set -o pipefail
          mkdir -p work/ci-issue24-startup
          node --import tsx --test tests/rename-editor-readiness.test.mjs 2>&1 | tee work/ci-issue24-startup/readiness-tests.txt
      - name: Preserve exact-SHA startup checkpoints and independent original results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-24-startup-${{ github.sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: work/ci-issue24-startup/
          if-no-files-found: error

  focused-raw-rename:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.checks == 'raw-rename' }}
    name: Focused Windows 2022 raw rename stress
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.21.1
          cache: npm
      - run: npm ci
      - id: build
        run: npm run build:service-test-lib
      - name: Verify actual PowerShell owned event correlation and retention controls
        id: etw_controls
        run: node --import tsx --test tests/windows-rename-etw.test.mjs
      - name: Observe owned fixture kernel file handles without changing rename acceptance
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.etw_controls.outcome == 'success' }}
        run: node --import tsx scripts/debug/windows-rename-etw.mjs
        env:
          WORKSPACE_RENAME_EVIDENCE_DIR: work/ci-raw-rename/kernel-file
      - name: Retain bounded idle, native, legacy and production scan comparisons
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node --import tsx scripts/windows-rename-diagnostics.mjs
        env:
          WORKSPACE_RENAME_EVIDENCE_DIR: work/ci-raw-rename
      - name: Original raw rename regression suite
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node --import tsx --test tests/windows-rename-diagnostics.test.mjs
      - name: Preserve exact-SHA raw rename evidence including negative operations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-24-raw-rename-${{ github.sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: work/ci-raw-rename/
          if-no-files-found: error

  focused-raw-renderer:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.checks == 'raw-rename' && inputs.raw_renderer_check }}
    name: Focused macOS original App fixture
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.21.1
          cache: npm
      - run: npm ci
      - run: npm run build:service-test-lib
      - name: Original renderer App regression file
        shell: bash
        run: |
          set -o pipefail
          mkdir -p work/ci-raw-renderer
          node --import tsx --test tests/renderer-app.test.tsx 2>&1 | tee work/ci-raw-renderer/tests.txt
      - name: Preserve exact-SHA App fixture result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-24-raw-renderer-${{ github.sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: work/ci-raw-renderer/
          if-no-files-found: error

  focused-creation-shutdown:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.checks == 'creation-shutdown' }}
    name: Focused Windows latest creation shutdown
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.21.1
          cache: npm
      - run: npm ci
      - run: npm run build
        id: creation-build
      - name: Prepare Electron binary before concurrent native regressions
        id: creation-electron
        run: node -e "require('electron')"
      - name: Verify quit evidence and lifecycle/route regressions
        run: node --import tsx --test tests/runtime-electron-quit.test.mjs tests/runtime-quit-evidence.test.mjs tests/runtime-lifecycle.test.mjs tests/property-editor-driver.test.mjs tests/test-suites.test.mjs
      - name: Original creation crash/recovery matrix
        if: ${{ !cancelled() && steps.creation-build.outcome == 'success' && steps.creation-electron.outcome == 'success' }}
        run: npm run smoke:runtime -- dev --creation --skip-native
        env:
          WORKSPACE_SMOKE_EVIDENCE_DIR: work/ci-focused-creation-shutdown
      - name: Retain original shutdown result and finite quit phases
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-23-creation-shutdown-${{ github.sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: work/ci-focused-creation-shutdown/
          if-no-files-found: error

  focused-issue22-failures:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.checks == 'issue22-failures' }}
    name: Issue 22 original failure (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.21.1
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify submission diagnostics and failure-route guards
        run: node --import tsx --test tests/rename-submission-receipt.test.mjs tests/test-suites.test.mjs
      - name: Original Windows recovery fanout suite
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          set -o pipefail
          mkdir -p work/ci-focused-issue22-failures
          node --import tsx --test tests/backend-lifecycle.test.mjs 2>&1 | tee work/ci-focused-issue22-failures/backend-lifecycle.log
      - name: Original macOS development runtime
        if: matrix.os == 'macos-latest'
        run: npm run smoke:runtime -- dev
        env:
          WORKSPACE_SMOKE_EVIDENCE_DIR: work/ci-focused-issue22-failures
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue-22-original-failures-${{ matrix.os }}-${{ github.sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: work/ci-focused-issue22-failures/
          if-no-files-found: error

  focused-property-fixture:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.checks == 'etw-controls' }}
    name: Focused macOS original property fixture
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.21.1
          cache: npm
      - run: npm ci
      - name: Original macOS property driver regression file
        shell: bash
        run: |
          set -o pipefail
          mkdir -p work/ci-focused-property-fixture
          node --import tsx --test tests/property-editor-driver.test.mjs 2>&1 | tee work/ci-focused-property-fixture/tests.txt
      - name: Preserve exact-SHA original property fixture result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-26-property-fixture-${{ github.sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: work/ci-focused-property-fixture/
          if-no-files-found: error

  focused-etw-controls:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.checks == 'etw-controls' }}
    name: Focused Windows latest original ETW controls
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.21.1
          cache: npm
      - run: npm ci
        id: install
      - name: Verify focused route guards
        run: node --import tsx --test tests/test-suites.test.mjs
      - name: Original Windows latest ETW regression file
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          mkdir -p work/ci-focused-etw
          node --import tsx --test tests/windows-rename-etw.test.mjs 2>&1 | tee work/ci-focused-etw/tests.txt
      - name: Preserve exact-SHA original ETW result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-26-etw-${{ github.sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: work/ci-focused-etw/
          if-no-files-found: error

  focused-windows-release-runtime:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.checks == 'windows-release' }}
    name: Focused Windows latest packaged runtime
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.21.1
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify lifecycle and focused route guards
        run: node --import tsx --test tests/runtime-lifecycle.test.mjs tests/rename-runtime-startup.test.mjs tests/project-category-move-runtime.test.mjs tests/test-suites.test.mjs
      - run: npm run package:built
      - run: npm run check:artifact -- release
      - name: Original Windows latest packaged runtime failure
        run: npm run smoke:runtime -- release
        env:
          WORKSPACE_SMOKE_EVIDENCE_DIR: work/ci-focused-windows-release
      - name: Retain original step and ownership evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-22-windows-release-${{ github.sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: work/ci-focused-windows-release/
          if-no-files-found: error

  focused-macos-readiness:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.checks == 'readiness' && inputs.readiness_reveal_windows != true }}
    name: Focused original Electron editor readiness
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.readiness_windows && '["windows-latest","windows-2022"]' || '["macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.21.1
          cache: npm
      - run: npm ci
      - name: Run original readiness suite
        shell: bash
        run: |
          set -o pipefail
          mkdir -p work/ci-focused-readiness
          node --test tests/rename-editor-readiness.test.mjs 2>&1 | tee work/ci-focused-readiness/tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue-21-focused-readiness-${{ matrix.os }}-${{ github.sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: work/ci-focused-readiness/
          if-no-files-found: error
          retention-days: 7

  focused-windows-reveal:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.checks == 'readiness' && inputs.readiness_reveal_windows == true }}
    name: Focused original Reveal service regressions (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.21.1
          cache: npm
      - name: Install focused Reveal dependencies with failure evidence
        shell: bash
        run: |

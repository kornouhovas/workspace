        if: ${{ !cancelled() && steps.reveal-build.outcome == 'success' && inputs.readiness_native_windows == true && inputs.readiness_native_early == true && matrix.os == 'windows-latest' }}
        run: npm run smoke:runtime -- dev --creation --discovery-mode=direct --checkpoint=after_evidence
        env:
          WORKSPACE_SMOKE_EVIDENCE_DIR: work/ci-focused-windows-reveal/native
          WORKSPACE_REVEAL_TRACE: '1'

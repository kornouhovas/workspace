name: Integrated native window chrome

on:
  workflow_call:
    inputs:
      repair_only:
        type: boolean
        default: false
      macos_only:
        type: boolean
        default: false
      windows_repair:
        type: boolean
        default: false
      native_repair:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  window-chrome:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ (inputs.repair_only && inputs.windows_repair) && fromJSON('["windows-latest","windows-2022"]') || (inputs.repair_only || inputs.macos_only || inputs.native_repair) && fromJSON('["macos-latest"]') || fromJSON('["macos-latest","windows-latest","windows-2022"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.21.1
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run check:docs
      - run: npm run build
        if: ${{ !inputs.repair_only }}
      - name: Retained shell, session and isolation regressions
        if: ${{ !inputs.repair_only && !inputs.native_repair }}
        shell: bash
        run: |
          mkdir -p work/ci-window-chrome
          set -o pipefail
          node --import tsx --test tests/renderer-app.test.tsx tests/runtime-view-readiness.test.mjs tests/workspace-sessions-service.test.mjs tests/backend-lifecycle.test.mjs tests/build-smoke.test.mjs tests/test-suites.test.mjs 2>&1 | tee work/ci-window-chrome/regressions.log
      - name: Endpoint observation regression
        if: ${{ inputs.repair_only }}
        shell: bash
        run: |
          mkdir -p work/ci-window-chrome
          set -o pipefail
          node --import tsx --test --test-name-pattern="projection endpoint observation" tests/runtime-view-readiness.test.mjs 2>&1 | tee work/ci-window-chrome/endpoint.log
      - name: Deferred native close focus control
        if: ${{ inputs.native_repair }}
        run: npm run smoke:window-chrome
        env:
          WORKSPACE_WINDOW_CHROME_FOCUS_CONTROL: '1'
          WORKSPACE_SMOKE_EVIDENCE_DIR: work/ci-window-chrome/focus-control
      - name: Delayed native sidebar restore control
        if: ${{ inputs.native_repair }}
        run: npm run smoke:window-chrome
        env:
          WORKSPACE_WINDOW_CHROME_RESTORE_CONTROL: '1'
          WORKSPACE_SMOKE_EVIDENCE_DIR: work/ci-window-chrome/restore-control
      - name: Native development window
        if: ${{ !inputs.repair_only }}
        run: npm run smoke:window-chrome
        env:
          WORKSPACE_SMOKE_EVIDENCE_DIR: work/ci-window-chrome/dev
      - name: Retained shell and settings journey
        if: ${{ !inputs.repair_only && !inputs.native_repair }}
        run: npm run smoke:shell
        env:
          WORKSPACE_SMOKE_EVIDENCE_DIR: work/ci-window-chrome/shell
      - run: npm run package:built
        if: ${{ !inputs.repair_only && !inputs.native_repair }}
      - run: npm run check:artifact -- release
        if: ${{ !inputs.repair_only && !inputs.native_repair }}
      - name: Native packaged window
        if: ${{ !inputs.repair_only && !inputs.native_repair }}
        run: npm run smoke:window-chrome
        env:
          WORKSPACE_SMOKE_MODE: release
          WORKSPACE_SMOKE_EVIDENCE_DIR: work/ci-window-chrome/release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: window-chrome-${{ matrix.os }}-${{ github.sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: work/ci-window-chrome/
          if-no-files-found: error
          retention-days: 14

name: Separate special archive

on:
  workflow_call:

permissions:
  contents: read

jobs:
  special-archive:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.21.1
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run check:docs
      - run: npm run build
      - name: Final complete suite
        shell: bash
        run: |
          mkdir -p work/ci-special-archive
          set -o pipefail
          npm run test:all 2>&1 | tee work/ci-special-archive/full.log
      - name: First-use archive and settings in development
        run: node scripts/smoke-special-archive.mjs
        env:
          WORKSPACE_SMOKE_EVIDENCE_DIR: work/ci-special-archive/dev
      - name: Retained contextual archive
        run: node scripts/smoke-contextual-archive.mjs dev --focus-only
      - name: Retained archive recovery and restart
        run: npm run smoke:archive -- dev
        env:
          WORKSPACE_SMOKE_EVIDENCE_DIR: work/ci-special-archive/retained-dev
      - run: npx electron-builder --dir
      - run: npm run check:artifact -- release
      - name: Packaged first-use archive and settings
        run: node scripts/smoke-special-archive.mjs
        env:
          WORKSPACE_SMOKE_MODE: release
          WORKSPACE_SMOKE_EVIDENCE_DIR: work/ci-special-archive/release
      - name: Packaged retained archive recovery and restart
        run: npm run smoke:archive -- release
        env:
          WORKSPACE_SMOKE_EVIDENCE_DIR: work/ci-special-archive/retained-release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: special-archive-${{ matrix.os }}-${{ github.sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            work/ci-special-archive/
            work/issue-62-archive-dev/
            work/issue-22-project-archive-runtime/
          if-no-files-found: error
          retention-days: 14

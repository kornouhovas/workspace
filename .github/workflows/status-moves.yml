name: Safe folder status assignment

on:
  workflow_call:
    inputs:
      phase:
        type: string
        default: full

permissions:
  contents: read

jobs:
  status-moves:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ inputs.phase == 'routing-repair' && fromJSON('["windows-latest","windows-2022"]') || inputs.phase == 'entry-repair' && fromJSON('["macos-latest","windows-latest"]') || fromJSON('["macos-latest","windows-latest","windows-2022"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.21.1
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run check:docs
      - run: npm run build
        if: ${{ inputs.phase != 'routing-repair' }}
      - name: Original failed workflow inventory and routing regressions
        if: ${{ inputs.phase == 'routing-repair' }}
        shell: bash
        run: |
          mkdir -p work/ci-status-moves
          set -o pipefail
          node --test tests/test-suites.test.mjs tests/status-moves-workflow.test.mjs 2>&1 | tee work/ci-status-moves/routing.log
      - name: Final complete suite
        if: ${{ inputs.phase == 'full' }}
        shell: bash
        run: |
          mkdir -p work/ci-status-moves
          set -o pipefail
          npm run test:all 2>&1 | tee work/ci-status-moves/full.log
      - name: Affected status controller and service regressions
        if: ${{ inputs.phase == 'runtime' }}
        shell: bash
        run: |
          mkdir -p work/ci-status-moves
          set -o pipefail
          node --import tsx --test tests/project-category-move-ui.test.tsx tests/role-command-ui.test.tsx tests/group-assignment-ui.test.tsx tests/status-assignment-service.test.mjs tests/group-assignment-service.test.mjs tests/role-project-commands.test.mjs tests/view-grouping-service.test.mjs 2>&1 | tee work/ci-status-moves/affected.log
      - name: Development status editing and Board/Table assignment
        if: ${{ inputs.phase != 'routing-repair' && !(inputs.phase == 'native-renewal' && matrix.os != 'windows-2022') }}
        run: node scripts/smoke-status-assignment.mjs
        env:
          WORKSPACE_SMOKE_EVIDENCE_DIR: work/ci-status-moves/dev
      - name: Retained explicit parent operations
        if: ${{ inputs.phase != 'routing-repair' && inputs.phase != 'entry-repair' && !(inputs.phase == 'native-renewal' && matrix.os == 'windows-2022') }}
        run: npm run smoke:folder-roles
        env:
          WORKSPACE_SMOKE_EVIDENCE_DIR: work/ci-status-moves/roles-dev
      - name: Retained ordinary and filesystem assignment
        if: ${{ inputs.phase != 'routing-repair' && inputs.phase != 'entry-repair' && !(inputs.phase == 'native-renewal' && matrix.os == 'windows-2022') }}
        run: node scripts/smoke-group-assignment.mjs --filesystem
        env:
          WORKSPACE_SMOKE_EVIDENCE_DIR: work/ci-status-moves/assignment-dev
      - name: Package reviewed candidate
        if: ${{ inputs.phase != 'routing-repair' && inputs.phase != 'entry-repair' }}
        run: npx electron-builder --dir
      - run: npm run check:artifact -- release
        if: ${{ inputs.phase != 'routing-repair' && inputs.phase != 'entry-repair' }}
      - name: Packaged status editing and Board/Table assignment
        if: ${{ inputs.phase != 'routing-repair' && inputs.phase != 'entry-repair' }}
        run: node scripts/smoke-status-assignment.mjs
        env:
          WORKSPACE_SMOKE_MODE: release
          WORKSPACE_SMOKE_EVIDENCE_DIR: work/ci-status-moves/release
      - name: Packaged retained explicit parent operations
        if: ${{ inputs.phase != 'routing-repair' && inputs.phase != 'entry-repair' && !(inputs.phase == 'native-renewal' && matrix.os == 'windows-2022') }}
        run: npm run smoke:folder-roles
        env:
          WORKSPACE_SMOKE_MODE: release
          WORKSPACE_SMOKE_EVIDENCE_DIR: work/ci-status-moves/roles-release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: status-moves-${{ matrix.os }}-${{ github.sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: work/ci-status-moves/
          if-no-files-found: error
          retention-days: 14

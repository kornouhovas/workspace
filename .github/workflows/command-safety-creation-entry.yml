name: Original Windows creation entry diagnosis
on:
  workflow_call:
permissions:
  contents: read
jobs:
  creation-entry:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      WORKSPACE_COMMAND_SAFETY_PHASE: runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.21.1
          cache: npm
      - run: mkdir -p work/ci-command-safety-creation-entry
        shell: bash
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run check:docs
      - id: build
        run: npm run build
      - id: enrollment
        name: Original successful enrollment prefix
        shell: bash
        env:
          WORKSPACE_SMOKE_MODE: dev
          WORKSPACE_SMOKE_EVIDENCE_DIR: work/ci-command-safety-creation-entry/source-enrollment
        run: |
          set -o pipefail
          node scripts/smoke-source-association.mjs 2>&1 | tee work/ci-command-safety-creation-entry/enrollment.log
      - name: Original eight creation checkpoints with passive entry evidence
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.enrollment.outcome == 'success' }}
        shell: bash
        env:
          WORKSPACE_CREATION_CONTEXT_DIAGNOSTIC: '1'
          WORKSPACE_SMOKE_EVIDENCE_DIR: work/ci-command-safety-creation-entry/creation
        run: |
          set -o pipefail
          node scripts/smoke-project-creation.mjs dev 2>&1 | tee work/ci-command-safety-creation-entry/creation.log
      - name: Passive observation control
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          node --test tests/creation-context-observation.test.mjs 2>&1 | tee work/ci-command-safety-creation-entry/control.log
      - name: Retain primary and diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: command-safety-creation-entry-${{ github.sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: work/ci-command-safety-creation-entry/
          if-no-files-found: error
          retention-days: 14

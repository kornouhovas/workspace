name: Command safety fixture diagnosis
on:
  workflow_call:
permissions:
  contents: read
jobs:
  fixtures:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.21.1
          cache: npm
      - run: npm ci
      - id: build
        run: npm run build
      - name: Record disposable path and injection observations
        shell: bash
        run: |
          mkdir -p work/ci-command-safety-fixtures
          node --import tsx tests/fixtures/command-safety-path-diagnostic.mjs
      - name: Original failed command safety fixtures
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          node --import tsx --test tests/archived-folder-association.test.mjs tests/durable-archive-location.test.mjs tests/durable-category-folder.test.mjs tests/durable-category-removal.test.mjs tests/durable-legacy-category-folder.test.mjs tests/durable-legacy-category-removal.test.mjs tests/durable-legacy-project-archive.test.mjs tests/durable-native-project.test.mjs tests/durable-project-archive.test.mjs tests/durable-project-creation.test.mjs tests/durable-project-recovery.test.mjs 2>&1 | tee work/ci-command-safety-fixtures/tests.log
      - name: Retain diagnostic and original results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: command-safety-fixtures-${{ matrix.os }}-${{ github.sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: work/ci-command-safety-fixtures/
          if-no-files-found: error
          retention-days: 14

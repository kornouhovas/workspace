name: Integrated desktop acceptance

on:
  workflow_dispatch:

concurrency:
  group: integrated-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Complete candidate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.21.1
          cache: npm
      - run: npm ci
      - name: Record exact source, run and actual host
        shell: bash
        run: |
          mkdir -p work/issue-67-ci
          node --input-type=module -e 'import {writeFileSync} from "node:fs";import os from "node:os";writeFileSync("work/issue-67-ci/provenance.json",JSON.stringify({sha:process.env.GITHUB_SHA,run:process.env.GITHUB_RUN_ID,attempt:process.env.GITHUB_RUN_ATTEMPT,platform:process.platform,arch:process.arch,kernel:os.release(),cpu:os.cpus()[0]?.model})+"\n")'
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run check:docs
      - run: npm run build
      - name: Complete current regression inventory
        shell: bash
        run: |
          set -o pipefail
          npm run test:all 2>&1 | tee work/issue-67-ci/full-suite.log
      - run: npm run build:ladle
      - name: Retained long-content, loading, pending and recovery layout inventory
        run: node scripts/smoke-discovery-layouts.mjs
        env:
          WORKSPACE_SMOKE_EVIDENCE_DIR: work/issue-67-ci/layouts
      - run: npm run package:built
      - run: npm run check:artifact -- release
      - name: Every principal and late UI journey on the unchanged package, then strict scale
        shell: bash
        run: |
          set -o pipefail
          node scripts/integrated-desktop.mjs 2>&1 | tee work/issue-67-ci/integrated.log
        env:
          WORKSPACE_SMOKE_EVIDENCE_DIR: work/issue-67-ci/packaged
      - name: Preserve actual failures, unreached stages and candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-67-${{ matrix.os }}-${{ github.sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: work/issue-67-ci/
          if-no-files-found: error
          retention-days: 14

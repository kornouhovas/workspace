{
  "version": 1,
  "description": "JSON-compatible YAML. Host coordinator delegates all work to executor and independent verifier per references/orchestration.md. loop.py only validates and records transitions; it does not spawn or authenticate agents.",
  "initial": "intake",
  "transitions": {
    "intake": [
      "planning"
    ],
    "planning": [
      "implementing"
    ],
    "implementing": [
      "verifying"
    ],
    "verifying": [
      "evaluating",
      "revising"
    ],
    "evaluating": [
      "delivering",
      "revising",
      "evaluating"
    ],
    "revising": [
      "planning"
    ],
    "delivering": [
      "done",
      "revising"
    ],
    "done": []
  },
  "actions": {
    "intake": "Executor: Read task, source, scope and constraints. Define outcome, falsifiable hypothesis and checks before implementation.",
    "planning": "Executor: Inspect reality, record baseline, choose smallest experiment and next action; preserve acceptance criteria.",
    "implementing": "Executor: Execute the selected solution within user authorization. Record changed artifacts and observations.",
    "verifying": "Executor: Run quality and regression checks on this attempt; fix defects through revising. Obtain independent verifier evidence for quality on this attempt before recording; coordinator only relays.",
    "evaluating": "Executor: Collect outcome evidence, assess all predeclared checks; distinguish supported, refuted, inconclusive. Obtain independent verifier evidence for outcome on this attempt before recording; coordinator only relays.",
    "revising": "Executor: Record incident, root cause and distinct next approach; retry with fresh evidence and unchanged goal.",
    "delivering": "Executor: Make the result usable in the intended scenario and record delivery evidence. Obtain independent verifier evidence for delivery on this attempt before recording; coordinator only relays.",
    "done": "Executor: All current checks pass, including outcome and delivery. Report evidence and limits."
  },
  "suspensions": [
    "waiting",
    "blocked",
    "paused",
    "budget_exhausted"
  ],
  "verdicts": [
    "untested",
    "supported",
    "refuted",
    "inconclusive"
  ]
}

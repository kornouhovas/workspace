<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Workspace</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="appShell" class="app-shell">
      <aside id="leftPanel" class="left-panel" aria-label="Workspace navigation">
        <div class="panel-top">
          <button
            id="sidebarToggle"
            class="icon-button sidebar-toggle"
            type="button"
            aria-label="Toggle sidebar (Command+B)"
            title="Toggle sidebar (Command+B)"
          >
            <svg aria-hidden="true" viewBox="0 0 20 20">
              <path d="M3.5 4.5h13v11h-13z" />
              <path d="M8 4.5v11" />
              <path d="M12.5 8 10.5 10l2 2" />
            </svg>
          </button>

          <button id="newWorkspaceButton" class="panel-action" type="button">
            <span class="action-icon" aria-hidden="true">
              <svg viewBox="0 0 20 20">
                <path d="M10 4.5v11" />
                <path d="M4.5 10h11" />
              </svg>
            </span>
            <span class="panel-action-label">New workspace</span>
          </button>

          <label class="search-field" for="workspaceSearch">
            <svg aria-hidden="true" viewBox="0 0 20 20">
              <circle cx="9" cy="9" r="4.5" />
              <path d="m12.5 12.5 3 3" />
            </svg>
            <input id="workspaceSearch" type="search" placeholder="Search" autocomplete="off" />
          </label>
        </div>

        <section class="workspace-section" aria-labelledby="workspaceSectionTitle">
          <h2 id="workspaceSectionTitle" class="workspace-section-title">Workspace</h2>
          <div id="workspaceList" class="workspace-list" role="list" aria-label="Workspaces"></div>
        </section>

        <button id="settingsButton" class="settings-button" type="button">
          <span class="action-icon" aria-hidden="true">
            <svg viewBox="0 0 20 20">
              <path d="M8.7 3.5h2.6l.45 2.1c.45.16.86.4 1.23.72l2-.68 1.3 2.25-1.56 1.42c.04.23.07.46.07.69s-.03.46-.07.69l1.56 1.42-1.3 2.25-2-.68c-.37.32-.78.56-1.23.72l-.45 2.1H8.7l-.45-2.1a5.1 5.1 0 0 1-1.23-.72l-2 .68-1.3-2.25 1.56-1.42A4 4 0 0 1 5.21 10c0-.23.03-.46.07-.69L3.72 7.89l1.3-2.25 2 .68c.37-.32.78-.56 1.23-.72z" />
              <circle cx="10" cy="10" r="2.1" />
            </svg>
          </span>
          <span class="settings-label">Settings</span>
        </button>
      </aside>

      <main class="main-surface" aria-label="Workspace surface">
        <div class="workspace-preview" aria-live="polite">
          <span class="workspace-preview-label">Current workspace</span>
          <h1 id="activeWorkspaceName">Workspace</h1>
        </div>
      </main>

      <div id="workspaceContextMenu" class="context-menu" role="menu" hidden>
        <button type="button" role="menuitem" data-action="rename">
          <span class="menu-icon" aria-hidden="true">
            <svg viewBox="0 0 20 20">
              <path d="M4.5 15.5h3l8-8a2.12 2.12 0 0 0-3-3l-8 8z" />
              <path d="m11.5 5.5 3 3" />
            </svg>
          </span>
          Rename
        </button>
        <button type="button" role="menuitem" data-action="pin">
          <span class="menu-icon" aria-hidden="true">
            <svg viewBox="0 0 20 20">
              <path d="m6.5 3.5 6 6" />
              <path d="m13 4 3 3-5 5v3l-1 1-3.5-3.5L3 9l1-1h3z" />
            </svg>
          </span>
          Pin workspace
        </button>
        <button type="button" role="menuitem" data-action="delete" class="danger-item">
          <span class="menu-icon" aria-hidden="true">
            <svg viewBox="0 0 20 20">
              <path d="M4.5 6h11" />
              <path d="M8 6V4.5h4V6" />
              <path d="M6 6.5 6.7 16h6.6l.7-9.5" />
              <path d="M8.5 9v4.5" />
              <path d="M11.5 9v4.5" />
            </svg>
          </span>
          Delete workspace
        </button>
      </div>
    </div>

    <script type="module" src="app.js"></script>
  </body>
</html>

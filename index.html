<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Folder Kanban</title>
    <script>
      try {
        const isSidebarCollapsed = localStorage.getItem("sidebar-state") === "collapsed";
        const hasSavedBoardState =
          localStorage.getItem("workspaces-state") || localStorage.getItem("folder-board-snapshot");
        if (hasSavedBoardState) {
          document.documentElement.classList.add("app-loading");
        }
        if (isSidebarCollapsed) {
          document.documentElement.classList.add("app-loading", "sidebar-saved-collapsed");
        }
      } catch (error) {}
    </script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell" id="appShell">
      <button
        class="icon-button sidebar-return"
        id="sidebarReturn"
        type="button"
        aria-label="Показать меню"
        title="Показать меню"
      >
        <span></span>
      </button>

      <aside class="sidebar" aria-label="Навигация">
        <div class="brand-row">
          <div class="brand-mark" aria-hidden="true"></div>
          <button
            class="icon-button sidebar-toggle"
            id="sidebarToggle"
            type="button"
            aria-label="Скрыть меню"
            title="Скрыть меню"
          >
            <span></span>
          </button>
        </div>

        <div class="workspace-list-head">
          <span class="eyebrow">Workspaces</span>
          <button
            class="icon-button add-workspace"
            id="addWorkspaceButton"
            type="button"
            aria-label="Добавить workspace"
            title="Добавить workspace"
          >
            +
          </button>
        </div>

        <nav class="workspace-tabs" id="workspaceTabs" aria-label="Workspaces"></nav>

        <nav class="workspace-tools" aria-label="Workspace tools">
          <button
            class="nav-item settings-nav-button"
            id="settingsNavButton"
            type="button"
            data-view="settings"
            title="Settings"
          >
            <span class="nav-icon" aria-hidden="true">S</span>
            <span class="nav-label">Settings</span>
          </button>
        </nav>
      </aside>

      <main class="main">
        <header class="topbar">
          <div class="topbar-copy">
            <div class="workspace-title-row">
              <button
                class="workspace-title-button"
                id="workspaceTitleButton"
                type="button"
                aria-label="Переименовать workspace"
                title="Переименовать workspace"
              >
                <h1 id="workspaceTitle">Workspace</h1>
              </button>
              <button
                class="icon-button title-edit-button"
                id="workspaceTitleEditButton"
                type="button"
                aria-label="Переименовать workspace"
                title="Переименовать workspace"
              >
                ✎
              </button>
              <input
                class="workspace-title-input"
                id="workspaceTitleInput"
                type="text"
                autocomplete="off"
                hidden
              />
            </div>
            <div class="board-view-switcher" id="boardViewSwitcher" aria-label="Вид доски">
              <button class="board-view-option active" type="button" data-board-view="overview">Overview</button>
              <button class="board-view-option" type="button" data-board-view="board">Board</button>
              <button class="board-view-option" type="button" data-board-view="table">Table</button>
              <label class="search board-view-search">
                <span class="search-icon" aria-hidden="true"></span>
                <input id="searchInput" type="search" placeholder="Search folders" autocomplete="off" />
              </label>
              <div class="board-view-settings">
                <button
                  class="board-view-settings-button"
                  id="boardColumnMenuButton"
                  type="button"
                  aria-label="Column visibility"
                  aria-haspopup="menu"
                  aria-expanded="false"
                  title="Column visibility"
                >
                  <svg class="settings-gear" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"></path>
                    <path
                      d="M19.4 15a1.75 1.75 0 0 0 .35 1.93l.06.06a2.1 2.1 0 1 1-2.97 2.97l-.06-.06a1.75 1.75 0 0 0-1.93-.35 1.75 1.75 0 0 0-1.05 1.6v.17a2.1 2.1 0 1 1-4.2 0v-.17a1.75 1.75 0 0 0-1.05-1.6 1.75 1.75 0 0 0-1.93.35l-.06.06a2.1 2.1 0 1 1-2.97-2.97l.06-.06A1.75 1.75 0 0 0 4.6 15a1.75 1.75 0 0 0-1.6-1.05h-.17a2.1 2.1 0 1 1 0-4.2H3a1.75 1.75 0 0 0 1.6-1.05 1.75 1.75 0 0 0-.35-1.93l-.06-.06a2.1 2.1 0 1 1 2.97-2.97l.06.06a1.75 1.75 0 0 0 1.93.35 1.75 1.75 0 0 0 1.05-1.6v-.17a2.1 2.1 0 1 1 4.2 0v.17a1.75 1.75 0 0 0 1.05 1.6 1.75 1.75 0 0 0 1.93-.35l.06-.06a2.1 2.1 0 1 1 2.97 2.97l-.06.06A1.75 1.75 0 0 0 19.4 9c.27.65.88 1.05 1.6 1.05h.17a2.1 2.1 0 1 1 0 4.2H21c-.72 0-1.33.4-1.6 1.05Z"
                    ></path>
                  </svg>
                </button>
                <div class="board-column-menu-popover" id="boardColumnMenuPopover" role="menu" hidden>
                  <div class="board-column-menu-section-title">Status</div>
                  <div class="board-column-menu-status-list" id="boardColumnMenuStatuses"></div>
                </div>
              </div>
            </div>
            <div class="board-view-switcher settings-view-switcher" id="settingsViewSwitcher" aria-label="Раздел настроек" hidden>
              <button class="board-view-option active" type="button">Access</button>
              <button class="board-view-option" type="button" disabled>Rules</button>
              <button class="board-view-option" type="button" disabled>Storage</button>
            </div>
          </div>
        </header>

        <section class="board-toolbar" aria-label="Инструменты">
          <div class="status-line" id="statusLine" role="status" hidden></div>
          <button class="ghost-button" id="restoreButton" type="button" hidden>Restore access</button>
        </section>

        <section class="kanban-board" aria-label="Карточки папок">
          <div class="folder-grid" id="folderGrid"></div>
          <div class="empty-state" id="emptyState">
            <span class="empty-icon" aria-hidden="true"></span>
            <h2>No folder selected</h2>
            <p>Pick a parent folder to show its direct subfolders as cards.</p>
          </div>
        </section>

        <aside class="card-place-panel" id="cardPlacePanel" aria-label="Card place" aria-hidden="true">
          <button
            class="card-place-resize-handle"
            id="cardPlaceResizeHandle"
            type="button"
            aria-label="Resize card place"
            title="Resize card place"
          ></button>
          <div class="card-place-content">
            <header class="card-place-header">
              <div class="card-place-title-row">
                <span
                  class="card-place-entry-icon is-directory card-place-folder-open"
                  id="cardPlaceFolderOpenButton"
                  role="button"
                  tabindex="0"
                  aria-label="Open card folder"
                  title="Open card folder"
                ></span>
                <h2 id="cardPlaceTitle"></h2>
              </div>
              <button
                class="icon-button card-place-close"
                id="cardPlaceCloseButton"
                type="button"
                aria-label="Close card place"
                title="Close"
              >
                ×
              </button>
            </header>
            <section class="card-place-field" aria-label="Status">
              <span class="eyebrow">Status</span>
              <p id="cardPlaceStatus"></p>
            </section>
            <section class="card-place-text-section" aria-label="Text">
              <label class="card-place-section-title" for="cardPlaceText">Text</label>
              <textarea
                class="card-place-text"
                id="cardPlaceText"
                rows="4"
                placeholder="Text"
                disabled
              ></textarea>
            </section>
            <section class="card-place-folder-section" aria-label="Folder contents">
              <div class="card-place-section-title">Folder</div>
              <div class="card-place-folder-list" id="cardPlaceFolderList"></div>
            </section>
          </div>
        </aside>
      </main>
    </div>

    <script>
      (() => {
        try {
          hydrateSavedWorkspaceState();
          hydrateSavedBoardViewState();
          hydrateSavedBoardSnapshot();
        } catch (error) {}

        function hydrateSavedWorkspaceState() {
          const state = JSON.parse(localStorage.getItem("workspaces-state"));
          if (!isStoredWorkspaceState(state)) {
            return;
          }

          const activeWorkspace =
            state.workspaces.find((workspace) => workspace.id === state.activeWorkspaceId) || state.workspaces[0];
          const workspaceTitle = document.querySelector("#workspaceTitle");
          const workspaceTabs = document.querySelector("#workspaceTabs");

          workspaceTitle.textContent = activeWorkspace.name;
          workspaceTabs.replaceChildren(...state.workspaces.map(createInitialWorkspaceTab));

          function createInitialWorkspaceTab(workspace, index) {
            const tab = document.createElement("div");
            tab.className = "workspace-tab";

            const button = document.createElement("button");
            button.className = "nav-item";
            button.type = "button";
            button.dataset.view = "workspace";
            button.dataset.workspaceId = workspace.id;
            button.title = workspace.name;
            button.classList.toggle("active", workspace.id === activeWorkspace.id);
            if (workspace.id === activeWorkspace.id) {
              button.setAttribute("aria-current", "page");
            }

            const icon = document.createElement("span");
            icon.className = "nav-icon";
            icon.setAttribute("aria-hidden", "true");
            icon.textContent = "W";

            const label = document.createElement("span");
            label.className = "nav-label";
            label.textContent = workspace.name;

            const deleteButton = document.createElement("button");
            deleteButton.className = "icon-button workspace-delete";
            deleteButton.type = "button";
            deleteButton.dataset.workspaceId = workspace.id;
            deleteButton.setAttribute("aria-label", `Удалить ${workspace.name}`);
            deleteButton.title = `Удалить ${workspace.name}`;
            deleteButton.textContent = "×";
            deleteButton.disabled = index === 0;

            button.append(icon, label);
            tab.append(button, deleteButton);

            return tab;
          }
        }

        function hydrateSavedBoardViewState() {
          const boardView = getStoredBoardView();
          const boardViewSwitcher = document.querySelector("#boardViewSwitcher");

          boardViewSwitcher.querySelectorAll("[data-board-view]").forEach((button) => {
            const isActive = button.dataset.boardView === boardView;
            button.classList.toggle("active", isActive);
            button.setAttribute("aria-pressed", String(isActive));
          });
        }

        function hydrateSavedBoardSnapshot() {
          const snapshot = JSON.parse(localStorage.getItem("folder-board-snapshot"));
          if (!isStoredBoardSnapshot(snapshot)) {
            return;
          }

          const workspaceState = JSON.parse(localStorage.getItem("workspaces-state"));
          const boardView = getStoredBoardView();
          const statusOrder = getStoredStatusOrder(workspaceState);
          const hiddenStatuses = getStoredHiddenStatuses(workspaceState);
          const showHiddenStatuses = getStoredShowHiddenStatuses(workspaceState);
          const tableColumnOrder = getStoredTableColumnOrder(workspaceState);
          const tableColumnWidths = getStoredTableColumnWidths(workspaceState);
          const tableHiddenColumns = getStoredTableHiddenColumns(workspaceState);
          const folderGrid = document.querySelector("#folderGrid");
          const emptyState = document.querySelector("#emptyState");
          if (snapshot.folders.length > 0) {
            emptyState.hidden = true;
            document.querySelector(".kanban-board").classList.toggle("board-mode", boardView === "board");
            document.querySelector(".kanban-board").classList.toggle("table-mode", boardView === "table");
            renderInitialFolders(
              folderGrid,
              snapshot.folders,
              boardView,
              statusOrder,
              hiddenStatuses,
              showHiddenStatuses,
              tableColumnOrder,
              tableColumnWidths,
              tableHiddenColumns,
            );
          } else {
            emptyState.querySelector("h2").textContent = "No folders in statuses";
            emptyState.querySelector("p").textContent =
              "Create folders inside the root status folders to display them as cards.";
          }
        }

        function renderInitialFolders(
          folderGrid,
          folders,
          boardView,
          statusOrder = [],
          hiddenStatuses = [],
          showHiddenStatuses = false,
          tableColumnOrder = ["name", "status", "text"],
          tableColumnWidths = { name: 34, status: 18, text: 42 },
          tableHiddenColumns = [],
        ) {
          if (boardView === "board") {
            folderGrid.className = "folder-board-view";
            folderGrid.replaceChildren(
              ...createInitialBoardColumns(folders, statusOrder, hiddenStatuses, showHiddenStatuses),
            );
            return;
          }

          if (boardView === "table") {
            folderGrid.className = "folder-table";
            folderGrid.replaceChildren(
              createInitialTable(
                folders,
                statusOrder,
                tableColumnOrder,
                tableColumnWidths,
                tableHiddenColumns,
                hiddenStatuses,
                showHiddenStatuses,
              ),
            );
            return;
          }

          folderGrid.className = "folder-grid";
          folderGrid.replaceChildren(...folders.map((folder) => createInitialFolderCard(folder)));
        }

        function createInitialBoardColumns(folders, statusOrder, hiddenStatuses, showHiddenStatuses) {
          const currentStatuses = [...new Set(folders.map((folder) => folder.status))];
          const currentStatusSet = new Set(currentStatuses);
          const savedStatuses = statusOrder.filter((status) => currentStatusSet.has(status));
          const newStatuses = currentStatuses.filter((status) => !savedStatuses.includes(status));

          const statuses = [...savedStatuses, ...newStatuses];
          return statuses
            .filter((status) => showHiddenStatuses || !hiddenStatuses.includes(status))
            .map((status) => {
              const column = document.createElement("section");
              column.className = "board-column";
              column.classList.toggle("is-hidden-column", hiddenStatuses.includes(status));

              const title = document.createElement("h2");
              title.className = "board-column-title";
              title.textContent = status;

              const cards = document.createElement("div");
              cards.className = "board-column-cards";
              cards.replaceChildren(
                ...folders
                  .filter((folder) => folder.status === status)
                  .map((folder) => createInitialFolderCard(folder, { showStatus: false })),
              );

              column.append(title, cards);

              return column;
            });
        }

        function createInitialTable(
          folders,
          statusOrder,
          tableColumnOrder,
          tableColumnWidths,
          tableHiddenColumns,
          hiddenStatuses,
          showHiddenStatuses,
        ) {
          const visibleTableColumnOrder = tableColumnOrder.filter((columnId) => !tableHiddenColumns.includes(columnId));
          const table = document.createElement("div");
          table.className = "folder-table-surface";
          table.style.setProperty("--table-name-column-width", `${tableColumnWidths.name}%`);
          table.style.setProperty("--table-status-column-width", `${tableColumnWidths.status}%`);
          table.style.setProperty("--table-text-column-width", `${tableColumnWidths.text}%`);
          table.style.setProperty(
            "--table-columns",
            visibleTableColumnOrder
              .map((columnId) =>
                `minmax(${columnId === "name" ? "180px" : "110px"}, var(--table-${columnId}-column-width))`,
              )
              .join(" "),
          );

          const header = document.createElement("div");
          header.className = "folder-table-row folder-table-head";
          header.append(
            ...tableColumnOrder.map((columnId) =>
              createInitialTableHeaderCell(columnId, folders, statusOrder, hiddenStatuses),
            ),
          );

          table.append(
            header,
            ...getInitialTableFolders(folders, statusOrder, hiddenStatuses, showHiddenStatuses).map((folder) =>
              createInitialTableRow(folder, visibleTableColumnOrder, hiddenStatuses),
            ),
          );

          return table;
        }

        function getInitialTableFolders(folders, statusOrder, hiddenStatuses, showHiddenStatuses) {
          const orderedStatuses = createInitialOrderedStatuses(folders, statusOrder);

          return folders
            .filter((folder) => showHiddenStatuses || !hiddenStatuses.includes(folder.status))
            .map((folder, index) => ({ folder, index }))
            .sort((left, right) => compareInitialFoldersByStatusOrder(left, right, orderedStatuses))
            .map(({ folder }) => folder);
        }

        function compareInitialFoldersByStatusOrder(left, right, orderedStatuses) {
          const leftStatusIndex = orderedStatuses.indexOf(left.folder.status);
          const rightStatusIndex = orderedStatuses.indexOf(right.folder.status);

          if (leftStatusIndex !== rightStatusIndex) {
            return leftStatusIndex - rightStatusIndex;
          }

          return left.index - right.index;
        }

        function createInitialTableHeaderCell(columnId, folders, statusOrder, hiddenStatuses) {
          const cell = document.createElement("div");
          cell.className = "folder-table-cell";
          cell.setAttribute("role", "button");
          cell.tabIndex = 0;
          cell.draggable = false;
          cell.dataset.tableColumn = columnId;

          const label = document.createElement("span");
          label.className = "table-header-label";
          label.textContent = columnId === "status" ? "Status" : columnId === "text" ? "Text" : "Name";
          cell.append(label);

          if (columnId === "status") {
            cell.classList.add("has-table-status-menu");
            cell.setAttribute("aria-haspopup", "menu");
            cell.setAttribute("aria-expanded", "false");
            cell.append(createInitialTableStatusMenu(createInitialOrderedStatuses(folders, statusOrder), hiddenStatuses));
          }

          cell.append(createInitialTableResizeHandle(columnId));

          return cell;
        }

        function createInitialTableStatusMenu(statuses, hiddenStatuses) {
          const menu = document.createElement("div");
          menu.className = "table-status-menu";
          menu.setAttribute("role", "menu");
          menu.hidden = true;
          menu.replaceChildren(
            ...statuses.map((status) => {
              const item = document.createElement("span");
              item.className = "table-status-menu-item";
              item.dataset.status = status;
              item.setAttribute("role", "menuitem");
              item.tabIndex = 0;
              item.draggable = false;

              const label = document.createElement("span");
              label.className = "table-status-menu-label";
              label.textContent = status;

              item.append(
                createInitialTableStatusDragHandle(),
                label,
                createInitialTableStatusVisibilityButton(status, hiddenStatuses.includes(status)),
              );

              return item;
            }),
          );

          return menu;
        }

        function createInitialTableStatusVisibilityButton(status, hidden) {
          const button = document.createElement("button");
          button.className = "table-status-visibility";
          button.type = "button";
          button.dataset.status = status;
          button.setAttribute("aria-label", hidden ? `Show ${status} section` : `Hide ${status} section`);
          button.setAttribute("aria-pressed", String(hidden));
          button.append(createInitialEyeIcon(hidden));

          return button;
        }

        function createInitialTableStatusDragHandle() {
          const handle = document.createElementNS("http://www.w3.org/2000/svg", "svg");
          handle.setAttribute("class", "table-status-drag-handle");
          handle.setAttribute("viewBox", "0 0 24 24");
          handle.setAttribute("aria-hidden", "true");

          ["M8 7h8", "M8 12h8", "M8 17h8"].forEach((pathData) => {
            const line = document.createElementNS("http://www.w3.org/2000/svg", "path");
            line.setAttribute("d", pathData);
            handle.append(line);
          });

          return handle;
        }

        function createInitialTableResizeHandle(columnId) {
          const handle = document.createElement("span");
          handle.className = "table-resize-handle";
          handle.dataset.tableColumn = columnId;
          handle.setAttribute("aria-hidden", "true");

          return handle;
        }

        function createInitialOrderedStatuses(folders, statusOrder) {
          const currentStatuses = [...new Set(folders.map((folder) => folder.status))];
          const currentStatusSet = new Set(currentStatuses);
          const savedStatuses = statusOrder.filter((status) => currentStatusSet.has(status));
          const newStatuses = currentStatuses.filter((status) => !savedStatuses.includes(status));

          return [...savedStatuses, ...newStatuses];
        }

        function createInitialEyeIcon(hidden) {
          const icon = document.createElementNS("http://www.w3.org/2000/svg", "svg");
          icon.classList.add("eye-icon");
          icon.classList.toggle("is-hidden-status", hidden);
          icon.setAttribute("viewBox", "0 0 24 24");
          icon.setAttribute("aria-hidden", "true");

          const outline = document.createElementNS("http://www.w3.org/2000/svg", "path");
          outline.setAttribute(
            "d",
            "M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z",
          );

          const pupil = document.createElementNS("http://www.w3.org/2000/svg", "circle");
          pupil.setAttribute("cx", "12");
          pupil.setAttribute("cy", "12");
          pupil.setAttribute("r", "3.2");

          icon.append(outline, pupil);

          if (hidden) {
            const slash = document.createElementNS("http://www.w3.org/2000/svg", "path");
            slash.classList.add("eye-slash");
            slash.setAttribute("d", "M4.5 4.5 19.5 19.5");
            icon.append(slash);
          }

          return icon;
        }

        function createInitialTableRow(folder, tableColumnOrder, hiddenStatuses = []) {
          const row = document.createElement("div");
          row.className = "folder-table-row";
          row.dataset.folderPath = folder.path || folder.name;
          row.classList.toggle("is-hidden-status-row", hiddenStatuses.includes(folder.status));
          row.append(
            ...tableColumnOrder.map((columnId) =>
              createInitialTableCell(getInitialTableCellText(folder, columnId), columnId),
            ),
          );

          return row;
        }

        function getInitialTableCellText(folder, columnId) {
          if (columnId === "status") {
            return folder?.status || "Status";
          }

          if (columnId === "text") {
            return folder?.text || "";
          }

          return folder?.name || "Name";
        }

        function createInitialTableCell(text, columnId) {
          const cell = document.createElement("span");
          cell.className = "folder-table-cell";
          cell.dataset.tableColumn = columnId;
          cell.textContent = text;

          return cell;
        }

        function createInitialFolderCard(folder, options = {}) {
          const card = document.createElement("article");
          card.className = "folder-card";
          card.dataset.folderPath = folder.path || folder.name;

          const title = document.createElement("h2");
          title.textContent = folder.name;

          card.append(title);

          if (options.showStatus === false) {
            return card;
          }

          const meta = document.createElement("div");
          meta.className = "card-meta";
          const tag = document.createElement("span");
          tag.className = "folder-tag";
          tag.textContent = folder.status;
          meta.append(tag);
          card.append(meta);

          return card;
        }

        function getStoredBoardView() {
          const state = JSON.parse(localStorage.getItem("workspaces-state"));
          return getStoredActiveBoardViewConfig(state).type;
        }

        function getStoredStatusOrder(state) {
          const activeView = getStoredActiveBoardViewConfig(state);

          return Array.isArray(activeView.statusOrder)
            ? activeView.statusOrder.filter((status) => typeof status === "string")
            : [];
        }

        function getStoredHiddenStatuses(state) {
          const activeView = getStoredActiveBoardViewConfig(state);

          return Array.isArray(activeView.hiddenStatuses)
            ? activeView.hiddenStatuses.filter((status) => typeof status === "string")
            : [];
        }

        function getStoredShowHiddenStatuses(state) {
          return getStoredActiveBoardViewConfig(state).showHiddenStatuses === true;
        }

        function getStoredTableColumnOrder(state) {
          const activeView = getStoredActiveBoardViewConfig(state);
          const columnOrder = Array.isArray(activeView.tableColumnOrder) ? activeView.tableColumnOrder : [];
          const tableColumnIds = ["name", "status", "text"];
          const normalizedColumns = columnOrder.filter((columnId) => tableColumnIds.includes(columnId));
          const missingColumns = tableColumnIds.filter((columnId) => !normalizedColumns.includes(columnId));

          return [...normalizedColumns, ...missingColumns];
        }

        function getStoredTableColumnWidths(state) {
          const defaultWidths = { name: 34, status: 18, text: 42 };
          const activeView = getStoredActiveBoardViewConfig(state);
          const storedWidths = activeView.tableColumnWidths || {};

          if (!isStoredWorkspaceState(state)) {
            return defaultWidths;
          }

          return {
            name: normalizeInitialTableColumnWidth(storedWidths.name ?? activeView.tableNameWidth, 24, 78, 34),
            status: normalizeInitialTableColumnWidth(storedWidths.status, 12, 36, 18),
            text: normalizeInitialTableColumnWidth(storedWidths.text, 18, 60, 42),
          };
        }

        function getStoredTableHiddenColumns(state) {
          const activeView = getStoredActiveBoardViewConfig(state);
          const hiddenColumns = Array.isArray(activeView.tableHiddenColumns) ? activeView.tableHiddenColumns : [];

          return hiddenColumns.filter((columnId) => ["status", "text"].includes(columnId));
        }

        function getStoredActiveBoardViewConfig(state) {
          const fallbackView = {
            type: "overview",
            statusOrder: [],
            hiddenStatuses: [],
            showHiddenStatuses: false,
            tableColumnOrder: ["name", "status", "text"],
            tableHiddenColumns: [],
            tableColumnWidths: { name: 34, status: 18, text: 42 },
          };
          if (!isStoredWorkspaceState(state)) {
            return fallbackView;
          }

          const activeWorkspace =
            state.workspaces.find((workspace) => workspace.id === state.activeWorkspaceId) || state.workspaces[0];
          const boardViews = Array.isArray(activeWorkspace.boardViews) ? activeWorkspace.boardViews : [];
          const activeView =
            boardViews.find((view) => view.id === activeWorkspace.boardView) ||
            boardViews.find((view) => view.type === activeWorkspace.boardView);

          if (activeView) {
            return {
              ...fallbackView,
              ...activeView,
              type: ["overview", "board", "table"].includes(activeView.type) ? activeView.type : "overview",
            };
          }

          const legacyBoardView = ["overview", "board", "table"].includes(activeWorkspace.boardView)
            ? activeWorkspace.boardView
            : "overview";

          return {
            ...fallbackView,
            type: legacyBoardView,
            statusOrder: activeWorkspace.statusOrder,
            hiddenStatuses: activeWorkspace.hiddenStatuses,
            showHiddenStatuses: activeWorkspace.showHiddenStatuses,
            tableColumnOrder: activeWorkspace.tableColumnOrder,
            tableHiddenColumns: activeWorkspace.tableHiddenColumns,
            tableColumnWidths: activeWorkspace.tableColumnWidths,
            tableNameWidth: activeWorkspace.tableNameWidth,
          };
        }

        function normalizeInitialTableColumnWidth(width, min, max, fallback) {
          const tableColumnWidth = Number(width);

          return Number.isFinite(tableColumnWidth) ? Math.min(max, Math.max(min, Math.round(tableColumnWidth))) : fallback;
        }

        function isStoredWorkspaceState(state) {
          return (
            state &&
            Array.isArray(state.workspaces) &&
            state.workspaces.length > 0 &&
            state.workspaces.every(
              (workspace) => typeof workspace.id === "string" && typeof workspace.name === "string",
            ) &&
            typeof state.activeWorkspaceId === "string"
          );
        }

        function isStoredBoardSnapshot(snapshot) {
          return (
            snapshot &&
            typeof snapshot.rootName === "string" &&
            Array.isArray(snapshot.folders) &&
            snapshot.folders.every(
              (folder) => typeof folder.name === "string" && typeof folder.status === "string",
            )
          );
        }
      })();
    </script>
    <script type="module" src="app.js"></script>
  </body>
</html>
